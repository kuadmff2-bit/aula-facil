name: Corrigir troca de instituição nos painéis

on:
  push:
    branches: [develop]
    paths:
      - "scripts/fix-school-change-listeners.py"
      - ".github/workflows/fix-school-change-listeners.yml"

permissions:
  contents: write

concurrency:
  group: fix-school-change-listeners
  cancel-in-progress: true

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Aplicar correção
        run: python scripts/fix-school-change-listeners.py
      - name: Testar regras
        run: npm test
      - name: Validar frontend
        run: npm run build
      - name: Gerar ícones
        run: npm run desktop:icons
      - name: Validar Tauri
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Publicar apenas se tudo passou
        shell: bash
        run: |
          if git diff --quiet -- src/message-automations-panel.tsx; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/message-automations-panel.tsx
          git commit -m "Sincronizar automações ao trocar instituição"
          git fetch origin develop
          git rebase origin/develop
          git push origin HEAD:develop
