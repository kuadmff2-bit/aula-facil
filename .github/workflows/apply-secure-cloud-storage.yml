name: Integrar sessão Supabase protegida

on:
  push:
    branches: [develop]
    paths:
      - "scripts/apply-secure-cloud-storage.py"
      - ".github/workflows/apply-secure-cloud-storage.yml"

permissions:
  contents: write

concurrency:
  group: apply-secure-cloud-storage
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Aplicar armazenamento protegido
        run: python scripts/apply-secure-cloud-storage.py
      - name: Validar frontend
        run: npm run build
      - name: Gerar recursos do Tauri
        run: npm run desktop:icons
      - name: Validar Tauri
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Publicar somente se tudo passou
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cloud.ts
          if git diff --cached --quiet; then
            echo "Nada a integrar."
            exit 0
          fi
          git commit -m "Armazenar sessão Supabase com DPAPI"
          git fetch origin develop
          git rebase origin/develop
          git push origin HEAD:develop
