name: Gerar instaladores do AulaFácil

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ARM64
            target: aarch64-pc-windows-msvc
            artifact: AulaFacil-Windows-ARM64
          - name: x64
            target: x86_64-pc-windows-msvc
            artifact: AulaFacil-Windows-x64

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Ativar cache do Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Instalar dependências
        run: npm ci

      - name: Gerar ícones
        run: npm run desktop:icons

      - name: Compilar o instalador
        run: npm run desktop -- build --target ${{ matrix.target }}

      - name: Dar um nome simples ao instalador
        shell: pwsh
        run: |
          $source = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $source) { throw "O instalador não foi encontrado." }
          New-Item -ItemType Directory -Force -Path "dist-installers" | Out-Null
          Copy-Item $source.FullName "dist-installers/${{ matrix.artifact }}-Setup.exe"

      - name: Guardar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-installers/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publicar downloads
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar os dois instaladores
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Criar a versão 0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(
            "installers/AulaFacil-Windows-ARM64/AulaFacil-Windows-ARM64-Setup.exe"
            "installers/AulaFacil-Windows-x64/AulaFacil-Windows-x64-Setup.exe"
          )
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 "${files[@]}" --clobber
          else
            gh release create v0.1.0 "${files[@]}" \
              --title "AulaFácil Desktop 0.1.0" \
              --notes "Primeira versão desktop do AulaFácil. Use ARM64 no Galaxy Book Go; use x64 em computadores Intel ou AMD."
          fi
