name: Gerar instaladores do AulaFácil

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Windows ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ARM64
            target: aarch64-pc-windows-msvc
            artifact: AulaFacil-Windows-ARM64
          - name: x64
            target: x86_64-pc-windows-msvc
            artifact: AulaFacil-Windows-x64

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Ativar cache do Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Instalar dependências
        run: npm ci

      - name: Gerar ícones
        run: npm run desktop:icons

      - name: Compilar o instalador
        run: npm run desktop -- build --target ${{ matrix.target }}

      - name: Dar um nome simples ao instalador
        shell: pwsh
        run: |
          $source = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $source) { throw "O instalador não foi encontrado." }
          New-Item -ItemType Directory -Force -Path "dist-installers" | Out-Null
          Copy-Item $source.FullName "dist-installers/${{ matrix.artifact }}-Setup.exe"

      - name: Guardar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-installers/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publicar downloads
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Baixar os dois instaladores
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Preparar downloads e hashes verificáveis
        run: |
          mkdir -p release-assets
          cp installers/AulaFacil-Windows-ARM64/AulaFacil-Windows-ARM64-Setup.exe release-assets/
          cp installers/AulaFacil-Windows-x64/AulaFacil-Windows-x64-Setup.exe release-assets/
          cd release-assets
          sha256sum *.exe > SHA256SUMS.txt

      - name: Publicar a versão do aplicativo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(
            "release-assets/AulaFacil-Windows-ARM64-Setup.exe"
            "release-assets/AulaFacil-Windows-x64-Setup.exe"
            "release-assets/SHA256SUMS.txt"
          )
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --title "AulaFácil Desktop ${version}" \
              --notes "Versão desktop local e independente do AulaFácil. Abre limpa, funciona sem login e sem internet. Use ARM64 no Galaxy Book Go; use x64 em computadores Intel ou AMD."
          fi
