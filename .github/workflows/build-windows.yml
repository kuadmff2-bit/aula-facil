name: Gerar instaladores do AulaFácil

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ARM64
            target: aarch64-pc-windows-msvc
            artifact: AulaFacil-Windows-ARM64
          - name: x64
            target: x86_64-pc-windows-msvc
            artifact: AulaFacil-Windows-x64

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Ativar cache do Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Instalar dependências
        run: npm ci

      - name: Gerar ícones
        run: npm run desktop:icons

      - name: Compilar o instalador
        run: npm run desktop -- build --target ${{ matrix.target }}

      - name: Guardar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
