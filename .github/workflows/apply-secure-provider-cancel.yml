name: Apply secure provider cancellation

on:
  push:
    branches:
      - hardening-backend-0.4.13
    paths:
      - scripts/patch-secure-cancel.py
      - .github/workflows/apply-secure-provider-cancel.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: hardening-backend-0.4.13
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply finance cancellation patch
        run: python3 scripts/patch-secure-cancel.py

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck and build
        run: npm run build

      - name: Commit validated cancellation flow
        run: |
          if git diff --quiet -- src/finance-ultimate.tsx; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/finance-ultimate.tsx
          git commit -m "fix: cancel external charge before cancelling invoice"
          git push origin HEAD:hardening-backend-0.4.13
