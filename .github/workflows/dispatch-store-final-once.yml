name: Disparar pacote final da Store

on:
  push:
    branches:
      - release/store-0.3.1-final
    paths:
      - .github/workflows/dispatch-store-final-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Executar workflow oficial da Store
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-store-msix.yml --repo kuadmff2-bit/aula-facil --ref release/store-0.3.1-final
