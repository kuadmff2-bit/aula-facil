name: Validate backend hardening 0.4.13

on:
  push:
    branches:
      - hardening-backend-0.4.13

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic patch and capture result
        shell: bash
        run: |
          set +e
          python scripts/harden_sync_0413.py > patch-debug.log 2>&1
          status=$?
          cat patch-debug.log
          echo "$status" > patch-status.txt
          exit 0

      - name: Persist diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f patch-debug.log patch-status.txt
          git commit -m "debug: record hardening patch status"
          git push

      - name: Stop when patch failed
        shell: bash
        run: |
          test "$(cat patch-status.txt)" = "0"

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck and build
        run: npm run build

      - name: Commit generated hardening
        shell: bash
        run: |
          git rm -f patch-debug.log patch-status.txt || true
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cloud-safe-sync.ts package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "release: AulaFácil 0.4.13 hardens cloud synchronization"
          git push
