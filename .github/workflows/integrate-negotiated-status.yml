name: Integrar negociações no Financeiro

on:
  push:
    branches: [develop]
    paths:
      - "scripts/integrate-negotiated-status.py"
      - ".github/workflows/integrate-negotiated-status.yml"

permissions:
  contents: write

concurrency:
  group: integrate-negotiated-status
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: develop, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: python scripts/integrate-negotiated-status.py
      - run: node scripts/quality-check.mjs
      - run: npm run build
      - run: npm run desktop:icons
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Publicar somente se tudo passou
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/model.ts src/finance-ultimate.tsx src/App.tsx src/styles.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrar cobranças renegociadas e acordos financeiros"
          git fetch origin develop
          git rebase origin/develop
          git push origin HEAD:develop
