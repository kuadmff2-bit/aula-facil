name: Revisão final de estabilidade e nuvem

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/review-stability-cloud.yml"

permissions:
  contents: write

concurrency:
  group: review-stability-cloud
  cancel-in-progress: true

jobs:
  review:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Aplicar revisão de clareza e resiliência
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          def write(path: str, content: str):
              Path(path).write_text(textwrap.dedent(content).lstrip(), encoding="utf-8")

          # 1) Estado real do salvamento local para a interface.
          storage_path = Path("src/storage.ts")
          storage = storage_path.read_text(encoding="utf-8-sig")
          marker = "let storageFailureShown = false;\n"
          addition = '''let writeGeneration = 0;

          export type LocalStorageState = {
            status: "ready" | "saving" | "saved" | "error";
            mode: "protected" | "browser";
            savedAt?: string;
            message?: string;
          };

          let lastStorageState: LocalStorageState = { status: "ready", mode: "browser" };

          function storageMode(): LocalStorageState["mode"] {
            return desktopRuntime ? "protected" : "browser";
          }

          function emitStorageState(detail: Omit<LocalStorageState, "mode"> & { mode?: LocalStorageState["mode"] }) {
            lastStorageState = { ...detail, mode: detail.mode ?? storageMode() };
            if (typeof window !== "undefined") {
              window.dispatchEvent(new CustomEvent("aulafacil:storage-state", { detail: lastStorageState }));
            }
          }

          export function getLocalStorageState(): LocalStorageState {
            return { ...lastStorageState, mode: storageMode() };
          }
          '''
          addition = textwrap.dedent(addition)
          if "export type LocalStorageState" not in storage:
              if marker not in storage:
                  raise SystemExit("Não encontrei o ponto de estado do armazenamento.")
              storage = storage.replace(marker, marker + addition, 1)

          init_marker = "  desktopRuntime = Boolean(internals()?.invoke);\n"
          if "emitStorageState({ status: \"ready\", mode: storageMode() });" not in storage:
              storage = storage.replace(init_marker, init_marker + "  emitStorageState({ status: \"ready\", mode: storageMode() });\n", 1)

          replace_marker = "  storageFailureShown = false;\n}\n\nexport function loadDatabase"
          if "emitStorageState({ status: \"saved\", savedAt: new Date().toISOString() });\n}\n\nexport function loadDatabase" not in storage:
              storage = storage.replace(replace_marker, "  storageFailureShown = false;\n  emitStorageState({ status: \"saved\", savedAt: new Date().toISOString() });\n}\n\nexport function loadDatabase", 1)

          old_report = '''function reportStorageFailure(error: unknown) {
            console.error("Falha no armazenamento protegido do AulaFácil", error);
            if (storageFailureShown) return;
            storageFailureShown = true;
            const message = "O AulaFácil não conseguiu gravar os dados no armazenamento protegido. "
              + "Não feche o aplicativo até fazer um backup e verificar o problema.";
            window.dispatchEvent(new CustomEvent("aulafacil:storage-failure", { detail: { message } }));
          }
          '''
          old_report = textwrap.dedent(old_report)
          new_report = '''function reportStorageFailure(error: unknown) {
            console.error("Falha no armazenamento protegido do AulaFácil", error);
            const message = "O AulaFácil não conseguiu gravar os dados no armazenamento protegido. "
              + "Não feche o aplicativo até fazer um backup e verificar o problema.";
            emitStorageState({ status: "error", message });
            if (storageFailureShown) return;
            storageFailureShown = true;
            window.dispatchEvent(new CustomEvent("aulafacil:storage-failure", { detail: { message } }));
          }
          '''
          new_report = textwrap.dedent(new_report)
          if old_report in storage:
              storage = storage.replace(old_report, new_report, 1)

          start = storage.index("export function saveDatabase(database: SchoolDatabase) {")
          end = storage.index("\nexport function parseBackup", start)
          new_save = '''export function saveDatabase(database: SchoolDatabase) {
            cachedDatabase = structuredClone(database);
            const generation = ++writeGeneration;
            emitStorageState({ status: "saving" });

            if (!desktopRuntime) {
              try {
                localStorage.setItem(LEGACY_STORAGE_KEY, JSON.stringify(database));
                if (generation === writeGeneration) {
                  storageFailureShown = false;
                  emitStorageState({ status: "saved", savedAt: new Date().toISOString() });
                }
              } catch (error) {
                reportStorageFailure(error);
              }
              return;
            }

            const payload = JSON.stringify(database);
            writeQueue = writeQueue
              .catch(() => undefined)
              .then(async () => {
                await invoke<void>("secure_storage_save", { payload });
                localStorage.removeItem(LEGACY_STORAGE_KEY);
                storageFailureShown = false;
                if (generation === writeGeneration) {
                  emitStorageState({ status: "saved", savedAt: new Date().toISOString() });
                }
              })
              .catch((error) => {
                reportStorageFailure(error);
              });
          }
          '''
          storage = storage[:start] + textwrap.dedent(new_save) + storage[end:]
          storage_path.write_text(storage, encoding="utf-8")

          # 2) Metadados simples da última sincronização.
          sync_path = Path("src/cloud-safe-sync.ts")
          sync = sync_path.read_text(encoding="utf-8-sig")
          insert_after = '''function readBaseline(schoolId: string): SyncBaseline | null {
            try {
              const raw = localStorage.getItem(baselineKey(schoolId));
              if (!raw) return null;
              const parsed = JSON.parse(raw) as Partial<SyncBaseline>;
              if (!Number.isInteger(parsed.revision) || typeof parsed.localUpdatedAt !== "string" || typeof parsed.syncedAt !== "string") return null;
              return parsed as SyncBaseline;
            } catch { return null; }
          }
          '''
          insert_after = textwrap.dedent(insert_after)
          metadata = '''
          export type CloudSyncMetadata = {
            syncedAt: string;
            revision: number;
            role: CloudSyncRole | null;
          };

          export function getCloudSyncMetadata(schoolId: string): CloudSyncMetadata | null {
            const baseline = readBaseline(schoolId);
            if (!baseline) return null;
            return { syncedAt: baseline.syncedAt, revision: baseline.revision, role: baseline.role ?? null };
          }
          '''
          metadata = textwrap.dedent(metadata)
          if "export function getCloudSyncMetadata" not in sync:
              if insert_after not in sync:
                  raise SystemExit("Não encontrei readBaseline para expor metadados.")
              sync = sync.replace(insert_after, insert_after + metadata, 1)
          sync_path.write_text(sync, encoding="utf-8")

          # 3) Conta = identidade e instituição. Sincronização fica em um único lugar.
          write("src/cloud-account.tsx", r'''
          import { useEffect, useMemo, useState, type FormEvent } from "react";
          import {
            createCloudSchool,
            getCloudAuthState,
            getCloudDataSummary,
            listCloudSchools,
            onCloudAuthChange,
            resendCloudSignupConfirmation,
            signInCloud,
            signOutCloud,
            signUpCloud,
            type CloudAuthState,
            type CloudDataSummary,
            type CloudSchool,
            type SchoolRole,
          } from "./cloud";
          import type { SchoolDatabase } from "./model";
          import { LegalAcceptancePanel } from "./legal-acceptance-panel";
          import { copyCurrentLegalAcceptanceToSchool } from "./legal-acceptance";
          import "./cloud-account.css";

          const SELECTED_SCHOOL_KEY = "aulafacil.cloud.selected-school";
          const CLOUD_SCHOOL_CHANGE_EVENT = "aulafacil:cloud-school-change";

          type Props = { database: SchoolDatabase };
          type Message = { tone: "success" | "warning" | "danger"; text: string } | null;

          const roleLabel: Record<SchoolRole, string> = {
            owner: "Proprietário",
            admin: "Administrador",
            finance: "Financeiro",
            teacher: "Professor",
            staff: "Equipe",
          };

          function localRecordCount(database: SchoolDatabase) {
            return database.classes.length + database.students.length + database.invoices.length
              + database.payments.length + database.attendance.length + database.grades.length + database.notices.length;
          }

          function announceSchoolChange() {
            window.dispatchEvent(new Event(CLOUD_SCHOOL_CHANGE_EVENT));
          }

          export function CloudAccountPanel({ database }: Props) {
            const [auth, setAuth] = useState<CloudAuthState>({ session: null, user: null });
            const [schools, setSchools] = useState<CloudSchool[]>([]);
            const [selectedSchoolId, setSelectedSchoolId] = useState(() => localStorage.getItem(SELECTED_SCHOOL_KEY) ?? "");
            const [summary, setSummary] = useState<CloudDataSummary | null>(null);
            const [mode, setMode] = useState<"signin" | "signup">("signin");
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [schoolName, setSchoolName] = useState("");
            const [busy, setBusy] = useState(false);
            const [message, setMessage] = useState<Message>(null);
            const [schoolsLoaded, setSchoolsLoaded] = useState(false);
            const [legalReady, setLegalReady] = useState(false);
            const [pendingConfirmationEmail, setPendingConfirmationEmail] = useState("");

            const selectedSchool = useMemo(
              () => schools.find((school) => school.id === selectedSchoolId) ?? null,
              [schools, selectedSchoolId],
            );

            const refreshSchools = async () => {
              const next = await listCloudSchools();
              setSchools(next);
              setSelectedSchoolId((current) => {
                const valid = next.some((school) => school.id === current);
                const selected = valid ? current : next[0]?.id ?? "";
                if (selected) localStorage.setItem(SELECTED_SCHOOL_KEY, selected);
                else localStorage.removeItem(SELECTED_SCHOOL_KEY);
                return selected;
              });
              setSchoolsLoaded(true);
            };

            useEffect(() => {
              let active = true;
              void getCloudAuthState()
                .then((state) => {
                  if (!active) return;
                  setAuth(state);
                  if (state.user) return refreshSchools();
                  setSchoolsLoaded(true);
                })
                .catch((error) => active && setMessage({ tone: "danger", text: error instanceof Error ? error.message : "Não foi possível verificar a conta." }));

              const unsubscribe = onCloudAuthChange((state) => {
                if (!active) return;
                setAuth(state);
                if (!state.user) {
                  setSchools([]);
                  setSummary(null);
                  setSelectedSchoolId("");
                  setSchoolsLoaded(true);
                  setLegalReady(false);
                  localStorage.removeItem(SELECTED_SCHOOL_KEY);
                  announceSchoolChange();
                  return;
                }
                setSchoolsLoaded(false);
                void refreshSchools().catch((error) => setMessage({ tone: "danger", text: error instanceof Error ? error.message : "Não foi possível atualizar as instituições." }));
              });

              return () => { active = false; unsubscribe(); };
            }, []);

            useEffect(() => {
              setLegalReady(false);
              if (!selectedSchoolId || !auth.user) {
                setSummary(null);
                announceSchoolChange();
                return;
              }
              localStorage.setItem(SELECTED_SCHOOL_KEY, selectedSchoolId);
              announceSchoolChange();
              void getCloudDataSummary(selectedSchoolId)
                .then(setSummary)
                .catch((error) => setMessage({ tone: "danger", text: error instanceof Error ? error.message : "Não foi possível conferir a nuvem." }));
            }, [selectedSchoolId, auth.user]);

            const run = async (operation: () => Promise<void>) => {
              setBusy(true);
              setMessage(null);
              try { await operation(); }
              catch (error) { setMessage({ tone: "danger", text: error instanceof Error ? error.message : "A operação não pôde ser concluída." }); }
              finally { setBusy(false); }
            };

            const submitAuth = (event: FormEvent) => {
              event.preventDefault();
              void run(async () => {
                if (mode === "signin") {
                  await signInCloud(email, password);
                  setPendingConfirmationEmail("");
                  setMessage({ tone: "success", text: "Conta conectada neste computador." });
                } else {
                  if (password.length < 12) throw new Error("Para novas contas, use uma senha com pelo menos 12 caracteres.");
                  const normalizedEmail = email.trim().toLowerCase();
                  const result = await signUpCloud(normalizedEmail, password);
                  if (result.session) {
                    setPendingConfirmationEmail("");
                    setMessage({ tone: "success", text: "Conta criada e conectada. Agora crie ou selecione a instituição." });
                  } else {
                    try {
                      const existing = await signInCloud(normalizedEmail, password);
                      if (existing.session) {
                        setPendingConfirmationEmail("");
                        setMessage({ tone: "success", text: "Esse e-mail já tinha uma conta confirmada. O AulaFácil entrou normalmente." });
                        setPassword("");
                        return;
                      }
                    } catch { /* conta nova aguardando confirmação ou senha diferente */ }
                    setPendingConfirmationEmail(normalizedEmail);
                    setMessage({ tone: "warning", text: "Confira o e-mail de confirmação. Se essa conta já foi confirmada antes, use “Já confirmei / entrar”." });
                  }
                }
                setPassword("");
              });
            };

            if (!auth.user) {
              return (
                <section className="card cloud-account-card">
                  <div className="cloud-account-heading"><div><span className="cloud-eyebrow">CONTA</span><h2>{mode === "signin" ? "Entrar no AulaFácil Cloud" : "Criar conta"}</h2><p>A conta identifica quem está usando a nuvem. Seus cadastros continuam sendo salvos neste computador mesmo sem entrar.</p></div></div>
                  <form className="cloud-auth-form" onSubmit={submitAuth}>
                    <label><span>E-mail</span><input type="email" autoComplete="email" required maxLength={200} value={email} onChange={(e) => setEmail(e.target.value)} /></label>
                    <label><span>Senha</span><input type="password" autoComplete={mode === "signin" ? "current-password" : "new-password"} minLength={mode === "signup" ? 12 : 8} maxLength={256} required value={password} onChange={(e) => setPassword(e.target.value)} /></label>
                    {mode === "signup" && <small>Use pelo menos 12 caracteres e não reutilize a senha de outro serviço.</small>}
                    {message && <div className={`cloud-message ${message.tone}`} role="status">{message.text}</div>}
                    <button className="primary-button" disabled={busy}>{busy ? "Aguarde..." : mode === "signin" ? "Entrar" : "Criar conta"}</button>
                  </form>
                  {pendingConfirmationEmail && <div className="cloud-resend-box"><strong>Não recebeu o e-mail?</strong><span>Você pode reenviar a confirmação ou voltar direto para o login se a conta já estiver confirmada.</span><div className="cloud-resend-actions"><button className="secondary-button" type="button" disabled={busy} onClick={() => void run(async () => { await resendCloudSignupConfirmation(pendingConfirmationEmail); setMessage({ tone: "success", text: `Solicitamos um novo e-mail para ${pendingConfirmationEmail}.` }); })}>Reenviar confirmação</button><button className="secondary-button" type="button" disabled={busy} onClick={() => { setMode("signin"); setEmail(pendingConfirmationEmail); setPendingConfirmationEmail(""); setPassword(""); }}>Já confirmei / entrar</button></div></div>}
                  <button className="cloud-mode-button" type="button" onClick={() => { setMode(mode === "signin" ? "signup" : "signin"); setMessage(null); setPendingConfirmationEmail(""); setPassword(""); }}>{mode === "signin" ? "Ainda não tenho conta" : "Já tenho uma conta"}</button>
                </section>
              );
            }

            if (!schoolsLoaded) return <section className="card cloud-account-card"><div className="cloud-account-heading"><div><span className="cloud-eyebrow">CONTA</span><h2>Carregando sua conta</h2><p>Conferindo instituições e permissões...</p></div></div></section>;
            if (!legalReady) return <LegalAcceptancePanel schoolId={selectedSchoolId || null} onReady={() => setLegalReady(true)} />;

            return (
              <section className="card cloud-account-card">
                <div className="cloud-account-heading">
                  <div><span className="cloud-eyebrow">CONTA E INSTITUIÇÃO</span><h2>Quem está conectado</h2><p>{auth.user.email}</p></div>
                  <button className="secondary-button" disabled={busy} onClick={() => void run(async () => { await signOutCloud(); setMessage(null); })}>Sair neste computador</button>
                </div>

                <div className="cloud-account-guide"><strong>Aqui você só escolhe a conta e a instituição.</strong><span>Para enviar ou receber dados, use o bloco “Sincronização com a nuvem” logo abaixo. Assim existe um único lugar para sincronizar.</span></div>

                {schools.length === 0 ? (
                  <div className="cloud-empty-school">
                    <h3>Criar instituição na nuvem</h3><p>Isso cria o espaço isolado da sua escola. Depois você decide no bloco de sincronização qual cópia deve ser usada.</p>
                    <div className="cloud-create-row"><input maxLength={160} value={schoolName} onChange={(e) => setSchoolName(e.target.value)} placeholder={database.settings.institution.name || "Nome da instituição"} /><button type="button" className="primary-button" disabled={busy} onClick={() => void run(async () => { const id = await createCloudSchool(schoolName || database.settings.institution.name); await refreshSchools(); setSelectedSchoolId(id); setSchoolName(""); try { await copyCurrentLegalAcceptanceToSchool(id); setMessage({ tone: "success", text: "Instituição criada. Agora use o bloco de sincronização abaixo." }); } catch { setMessage({ tone: "warning", text: "Instituição criada. Revise os termos antes da primeira sincronização." }); } })}>{busy ? "Criando..." : "Criar instituição"}</button></div>
                    {message && <div className={`cloud-message ${message.tone} cloud-empty-school-message`} role="status">{message.text}</div>}
                  </div>
                ) : (
                  <>
                    <div className="cloud-school-selector"><label><span>Instituição usada neste computador</span><select value={selectedSchoolId} onChange={(e) => setSelectedSchoolId(e.target.value)}>{schools.map((school) => <option key={school.id} value={school.id}>{school.name} · {roleLabel[school.role]}</option>)}</select></label>{selectedSchool && <div className="cloud-role-chip">Acesso: {roleLabel[selectedSchool.role]}</div>}</div>
                    <div className="cloud-summary-grid"><div><strong>{localRecordCount(database)}</strong><span>registros neste computador</span></div><div><strong>{summary?.totalOperationalRecords ?? "—"}</strong><span>registros visíveis na nuvem</span></div><div><strong>{navigator.onLine ? "Online" : "Offline"}</strong><span>{navigator.onLine ? "nuvem disponível" : "o trabalho local continua funcionando"}</span></div></div>
                    {message && <div className={`cloud-message ${message.tone}`} role="status">{message.text}</div>}
                  </>
                )}
              </section>
            );
          }
          ''')

          # 4) Painel simples: computador, nuvem e backup.
          write("src/data-safety-panel.tsx", r'''
          import { useEffect, useState } from "react";
          import { CheckCircle2, Cloud, DatabaseBackup, HardDrive, RefreshCw, WifiOff } from "lucide-react";
          import { getCloudSyncMetadata, getCloudSyncStatus, type CloudSyncStatus } from "./cloud-safe-sync";
          import type { SchoolDatabase } from "./model";
          import { getLocalStorageState, type LocalStorageState } from "./storage";
          import "./data-safety-panel.css";

          const SELECTED_SCHOOL_KEY = "aulafacil.cloud.selected-school";
          type CloudState = CloudSyncStatus | "not_configured" | "offline" | "unavailable" | "checking";

          const cloudCopy: Record<CloudState, { title: string; text: string; tone: string }> = {
            checking: { title: "Conferindo a nuvem...", text: "Só um instante.", tone: "neutral" },
            not_configured: { title: "Nuvem ainda não configurada", text: "O salvamento neste computador continua funcionando normalmente.", tone: "neutral" },
            offline: { title: "Sem internet agora", text: "Você pode continuar trabalhando. Os dados ficam salvos neste computador.", tone: "warning" },
            unavailable: { title: "Não foi possível conferir agora", text: "Isso não impede o salvamento local. Tente verificar novamente quando quiser.", tone: "warning" },
            not_linked: { title: "Primeira sincronização pendente", text: "Escolha a instituição e faça a primeira sincronização no bloco abaixo.", tone: "warning" },
            synced: { title: "Computador e nuvem sincronizados", text: "As duas cópias estavam iguais na última verificação.", tone: "success" },
            local_changed: { title: "Há mudanças para enviar", text: "Seus dados já estão salvos neste computador; falta apenas atualizar a nuvem.", tone: "warning" },
            cloud_changed: { title: "Há novidades para baixar", text: "A nuvem mudou em outro dispositivo. Sincronize para receber as alterações.", tone: "warning" },
            conflict: { title: "Mudanças nos dois lados", text: "Nada foi sobrescrito. O bloco abaixo vai pedir qual cópia você quer manter.", tone: "danger" },
          };

          function moment(value?: string) {
            if (!value) return "Ainda não sincronizado";
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return "Última sincronização registrada";
            return `Última sincronização: ${date.toLocaleDateString("pt-BR")} às ${date.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}`;
          }

          export function DataSafetyPanel({ database, onOpenBackup }: { database: SchoolDatabase; onOpenBackup: () => void }) {
            const [localState, setLocalState] = useState<LocalStorageState>(() => getLocalStorageState());
            const [cloudState, setCloudState] = useState<CloudState>("checking");
            const [syncedAt, setSyncedAt] = useState<string | undefined>();

            useEffect(() => {
              const onStorage = (event: Event) => setLocalState((event as CustomEvent<LocalStorageState>).detail);
              window.addEventListener("aulafacil:storage-state", onStorage);
              return () => window.removeEventListener("aulafacil:storage-state", onStorage);
            }, []);

            useEffect(() => {
              let active = true;
              const check = async () => {
                const schoolId = localStorage.getItem(SELECTED_SCHOOL_KEY) ?? "";
                if (!schoolId) { if (active) { setCloudState("not_configured"); setSyncedAt(undefined); } return; }
                if (!navigator.onLine) { if (active) { setCloudState("offline"); setSyncedAt(getCloudSyncMetadata(schoolId)?.syncedAt); } return; }
                try {
                  const status = await getCloudSyncStatus(schoolId, database);
                  if (!active) return;
                  setCloudState(status);
                  setSyncedAt(getCloudSyncMetadata(schoolId)?.syncedAt);
                } catch {
                  if (active) { setCloudState("unavailable"); setSyncedAt(getCloudSyncMetadata(schoolId)?.syncedAt); }
                }
              };
              void check();
              const interval = window.setInterval(() => void check(), 60_000);
              const refresh = () => void check();
              window.addEventListener("online", refresh);
              window.addEventListener("offline", refresh);
              window.addEventListener("aulafacil:cloud-school-change", refresh);
              return () => { active = false; window.clearInterval(interval); window.removeEventListener("online", refresh); window.removeEventListener("offline", refresh); window.removeEventListener("aulafacil:cloud-school-change", refresh); };
            }, [database.updatedAt]);

            const localTitle = localState.status === "saving" ? "Salvando agora..." : localState.status === "error" ? "Falha ao salvar" : "Salvamento automático ativo";
            const localText = localState.status === "error"
              ? (localState.message || "Confira o armazenamento antes de fechar o aplicativo.")
              : localState.mode === "protected"
                ? "Cada alteração é gravada automaticamente e criptografada pelo Windows."
                : "Cada alteração é salva automaticamente neste navegador.";
            const cloud = cloudCopy[cloudState];

            return (
              <section className="card data-safety-card">
                <div className="data-safety-heading"><div><span>SEUS DADOS</span><h2>Salvamento sem mistério</h2><p><strong>Você não precisa clicar em “Salvar”.</strong> O AulaFácil salva neste computador automaticamente. A nuvem é uma segunda camada para sincronizar e recuperar dados.</p></div><CheckCircle2 className="data-safety-heading-icon" /></div>
                <div className="data-safety-grid">
                  <article className={`data-safety-item ${localState.status === "error" ? "danger" : localState.status === "saving" ? "working" : "success"}`}><div className="data-safety-icon"><HardDrive /></div><div><small>1 · NESTE COMPUTADOR</small><strong>{localTitle}</strong><span>{localText}</span>{localState.savedAt && localState.status === "saved" && <em>Salvo às {new Date(localState.savedAt).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" })}</em>}</div></article>
                  <article className={`data-safety-item ${cloud.tone}`}><div className="data-safety-icon">{cloudState === "offline" ? <WifiOff /> : cloudState === "checking" ? <RefreshCw className="spin" /> : <Cloud />}</div><div><small>2 · AULAFÁCIL CLOUD</small><strong>{cloud.title}</strong><span>{cloud.text}</span><em>{moment(syncedAt)}</em></div></article>
                  <article className="data-safety-item neutral"><div className="data-safety-icon"><DatabaseBackup /></div><div><small>3 · BACKUP PORTÁTIL</small><strong>Uma cópia que fica com você</strong><span>Use quando quiser guardar um arquivo protegido por senha fora do aplicativo.</span><button type="button" className="secondary-button" onClick={onOpenBackup}>Abrir Backup e segurança</button></div></article>
                </div>
                <div className="data-safety-footer">No dia a dia: <strong>trabalhe normalmente</strong> → o computador salva sozinho → quando houver mudanças, clique em <strong>Sincronizar agora</strong>.</div>
              </section>
            );
          }
          ''')

          write("src/data-safety-panel.css", r'''
          .data-safety-card{padding:24px;overflow:hidden}.data-safety-heading{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.data-safety-heading>div>span{display:block;color:var(--blue);font-size:11px;font-weight:900;letter-spacing:1.35px}.data-safety-heading h2{margin:4px 0 7px;color:var(--text);font-size:20px}.data-safety-heading p{max-width:850px;margin:0;color:var(--muted);font-size:13px;line-height:1.6}.data-safety-heading p strong{color:var(--text)}.data-safety-heading-icon{flex:0 0 auto;width:30px;height:30px;color:color-mix(in srgb,#10b981 78%,var(--text))}.data-safety-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}.data-safety-item{min-width:0;display:flex;gap:12px;padding:16px;border:1px solid var(--border,var(--line));border-radius:15px;background:var(--surface-soft,var(--canvas))}.data-safety-item>div:last-child{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}.data-safety-icon{width:36px;height:36px;flex:0 0 36px;display:grid;place-items:center;border-radius:11px;background:color-mix(in srgb,var(--blue) 10%,var(--surface));color:var(--blue)}.data-safety-icon svg{width:19px;height:19px}.data-safety-item small{color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.7px}.data-safety-item strong{color:var(--text);font-size:13px;line-height:1.35}.data-safety-item span{color:var(--muted);font-size:11.5px;line-height:1.5;overflow-wrap:anywhere}.data-safety-item em{margin-top:3px;color:var(--muted);font-size:10.5px;font-style:normal;font-weight:700}.data-safety-item .secondary-button{min-height:34px;margin-top:8px;padding:0 10px;font-size:11px}.data-safety-item.success{border-color:color-mix(in srgb,#10b981 28%,var(--border,var(--line)))}.data-safety-item.success .data-safety-icon{background:color-mix(in srgb,#10b981 10%,var(--surface));color:color-mix(in srgb,#10b981 80%,var(--text))}.data-safety-item.warning,.data-safety-item.working{border-color:color-mix(in srgb,#d97706 30%,var(--border,var(--line)))}.data-safety-item.warning .data-safety-icon,.data-safety-item.working .data-safety-icon{background:color-mix(in srgb,#d97706 10%,var(--surface));color:color-mix(in srgb,#d97706 82%,var(--text))}.data-safety-item.danger{border-color:color-mix(in srgb,#dc2626 34%,var(--border,var(--line)))}.data-safety-item.danger .data-safety-icon{background:color-mix(in srgb,#dc2626 10%,var(--surface));color:color-mix(in srgb,#dc2626 82%,var(--text))}.data-safety-footer{margin-top:12px;padding:11px 13px;border-radius:12px;background:color-mix(in srgb,var(--blue) 7%,var(--surface));color:var(--muted);font-size:11.5px;line-height:1.5}.data-safety-footer strong{color:var(--text)}.spin{animation:data-safety-spin 1s linear infinite}@keyframes data-safety-spin{to{transform:rotate(360deg)}}@container aulafacil-content (max-width:900px){.data-safety-grid{grid-template-columns:1fr}.data-safety-heading-icon{display:none}}@media(max-width:680px){.data-safety-card{padding:18px}.data-safety-heading h2{font-size:18px}.data-safety-item{padding:14px}}
          ''')

          # 5) Tela de recuperação sem becos sem saída: login e seleção de escola ali mesmo.
          write("src/storage-recovery-screen.tsx", r'''
          import { useEffect, useState, type FormEvent } from "react";
          import { CloudDownload, LogIn, RefreshCw, ShieldCheck } from "lucide-react";
          import { getCloudAuthState, listCloudSchools, signInCloud, type CloudSchool } from "./cloud";
          import { safePullFromCloud } from "./cloud-safe-sync";
          import { replaceProtectedDatabase } from "./storage";
          import "./storage-recovery-screen.css";

          const SELECTED_SCHOOL_KEY = "aulafacil.cloud.selected-school";

          export function StorageRecoveryScreen({ detail }: { detail: string }) {
            const [busy, setBusy] = useState(false);
            const [checking, setChecking] = useState(true);
            const [signedIn, setSignedIn] = useState(false);
            const [schools, setSchools] = useState<CloudSchool[]>([]);
            const [selectedSchoolId, setSelectedSchoolId] = useState("");
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [message, setMessage] = useState("");
            const [failed, setFailed] = useState(false);

            const refreshAccount = async () => {
              setChecking(true);
              try {
                const auth = await getCloudAuthState();
                const connected = Boolean(auth.user);
                setSignedIn(connected);
                if (!connected) { setSchools([]); setSelectedSchoolId(""); return; }
                const next = await listCloudSchools();
                setSchools(next);
                const remembered = localStorage.getItem(SELECTED_SCHOOL_KEY) ?? "";
                const selected = next.some((school) => school.id === remembered) ? remembered : next[0]?.id ?? "";
                setSelectedSchoolId(selected);
              } catch (error) {
                setFailed(true);
                setMessage(error instanceof Error ? error.message : "Não foi possível verificar a conta da nuvem.");
              } finally { setChecking(false); }
            };

            useEffect(() => { void refreshAccount(); }, []);

            const login = (event: FormEvent) => {
              event.preventDefault();
              if (busy) return;
              setBusy(true); setFailed(false); setMessage("Entrando na sua conta...");
              void signInCloud(email, password)
                .then(async () => { setPassword(""); setMessage("Conta conectada. Escolha a instituição que deseja recuperar."); await refreshAccount(); })
                .catch((error) => { setFailed(true); setMessage(error instanceof Error ? error.message : "Não foi possível entrar na conta."); })
                .finally(() => setBusy(false));
            };

            const recoverFromCloud = async () => {
              if (!selectedSchoolId || busy) return;
              setBusy(true); setFailed(false);
              try {
                const selected = schools.find((school) => school.id === selectedSchoolId);
                localStorage.setItem(SELECTED_SCHOOL_KEY, selectedSchoolId);
                setMessage(`Baixando ${selected?.name || "a instituição"} da nuvem. O arquivo local original ainda não será alterado...`);
                const database = await safePullFromCloud(selectedSchoolId, "system");
                setMessage("Cópia da nuvem validada. Preservando os arquivos locais em quarentena...");
                await replaceProtectedDatabase(database);
                setMessage("Dados recuperados com segurança. Reiniciando o AulaFácil...");
                window.setTimeout(() => window.location.reload(), 700);
              } catch (error) {
                setFailed(true);
                setMessage(error instanceof Error ? error.message : "Não foi possível recuperar os dados da nuvem.");
                setBusy(false);
              }
            };

            return (
              <main className="storage-recovery-page">
                <section className="storage-recovery-card">
                  <div className="storage-recovery-title"><span><ShieldCheck /></span><div><small>RECUPERAÇÃO SEGURA</small><h1>Seus dados locais continuam preservados</h1><p>O AulaFácil tentou o banco principal, a cópia de recuperação e os backups automáticos. Nenhuma cópia válida foi sobrescrita.</p></div></div>
                  <div className="storage-recovery-error"><strong>Por que o sistema não abriu?</strong><span>{detail}</span></div>
                  <div className="storage-recovery-steps"><div><b>1</b><span><strong>Arquivos locais preservados</strong><small>O aplicativo parou antes de gravar um banco vazio.</small></span></div><div><b>2</b><span><strong>A nuvem só entra se você escolher</strong><small>Antes de substituir o arquivo local, ele é copiado para uma pasta de quarentena.</small></span></div></div>

                  {checking ? <div className="storage-recovery-status"><RefreshCw className="spin" /> Conferindo sua conta da nuvem...</div> : !signedIn ? (
                    <form className="storage-recovery-login" onSubmit={login}><div><LogIn /><span><strong>Entrar no AulaFácil Cloud</strong><small>Você pode entrar aqui mesmo; não precisa conseguir abrir o restante do aplicativo.</small></span></div><label><span>E-mail</span><input type="email" autoComplete="email" required maxLength={200} value={email} onChange={(event) => setEmail(event.target.value)} /></label><label><span>Senha</span><input type="password" autoComplete="current-password" minLength={8} maxLength={256} required value={password} onChange={(event) => setPassword(event.target.value)} /></label><button className="storage-recovery-primary" disabled={busy}>{busy ? "Entrando..." : "Entrar e continuar"}</button></form>
                  ) : schools.length ? (
                    <div className="storage-recovery-cloud"><div><CloudDownload /><span><strong>Recuperar uma instituição da nuvem</strong><small>Selecione exatamente qual escola deseja restaurar neste computador.</small></span></div><label><span>Instituição</span><select value={selectedSchoolId} onChange={(event) => setSelectedSchoolId(event.target.value)}>{schools.map((school) => <option key={school.id} value={school.id}>{school.name}</option>)}</select></label><button className="storage-recovery-primary" disabled={busy || !selectedSchoolId} onClick={() => void recoverFromCloud()}>{busy ? "Recuperando..." : "Recuperar esta instituição"}</button></div>
                  ) : <div className="storage-recovery-status warning">Sua conta está conectada, mas não possui uma instituição disponível para recuperação.</div>}

                  {message && <div className={`storage-recovery-message ${failed ? "danger" : "success"}`} role="status">{message}</div>}
                  <div className="storage-recovery-footer"><button type="button" className="storage-recovery-secondary" disabled={busy} onClick={() => window.location.reload()}><RefreshCw /> Tentar cópias locais novamente</button><span>Nunca limpe a pasta de dados para resolver esta tela. Use recuperação ou um backup validado.</span></div>
                </section>
              </main>
            );
          }
          ''')

          write("src/storage-recovery-screen.css", r'''
          .storage-recovery-page{min-height:100vh;display:grid;place-items:center;padding:32px;background:#f1f4f8;color:#172033}.storage-recovery-card{width:min(760px,100%);padding:30px;border:1px solid #dce3ec;border-radius:22px;background:#fff;box-shadow:0 20px 55px rgba(20,35,60,.12)}.storage-recovery-title{display:flex;gap:16px;align-items:flex-start}.storage-recovery-title>span{width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;border-radius:14px;background:#eaf1ff;color:#1649b8}.storage-recovery-title svg{width:25px}.storage-recovery-title small{color:#1649b8;font-size:10px;font-weight:900;letter-spacing:1.2px}.storage-recovery-title h1{margin:4px 0 7px;font-size:25px;line-height:1.2}.storage-recovery-title p{margin:0;color:#5f6d80;font-size:13px;line-height:1.6}.storage-recovery-error{display:grid;gap:5px;margin-top:20px;padding:13px 15px;border:1px solid #f0c6cc;border-radius:13px;background:#fff5f6}.storage-recovery-error strong{font-size:12px;color:#922337}.storage-recovery-error span{font-size:12px;line-height:1.5;color:#7a2c39;overflow-wrap:anywhere}.storage-recovery-steps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.storage-recovery-steps>div{display:flex;gap:10px;padding:13px;border:1px solid #dce3ec;border-radius:13px;background:#f8fafc}.storage-recovery-steps b{width:25px;height:25px;flex:0 0 25px;display:grid;place-items:center;border-radius:8px;background:#1649b8;color:white;font-size:11px}.storage-recovery-steps span{display:grid;gap:3px}.storage-recovery-steps strong{font-size:12px}.storage-recovery-steps small{color:#68768a;font-size:11px;line-height:1.45}.storage-recovery-login,.storage-recovery-cloud{display:grid;gap:12px;margin-top:16px;padding:17px;border:1px solid #cfd9e7;border-radius:15px;background:#f8fafc}.storage-recovery-login>div,.storage-recovery-cloud>div{display:flex;gap:10px;align-items:center}.storage-recovery-login>div>svg,.storage-recovery-cloud>div>svg{color:#1649b8}.storage-recovery-login>div>span,.storage-recovery-cloud>div>span{display:grid;gap:2px}.storage-recovery-login strong,.storage-recovery-cloud strong{font-size:13px}.storage-recovery-login small,.storage-recovery-cloud small{color:#68768a;font-size:11px}.storage-recovery-login label,.storage-recovery-cloud label{display:grid;gap:6px}.storage-recovery-login label>span,.storage-recovery-cloud label>span{font-size:11px;font-weight:800}.storage-recovery-login input,.storage-recovery-cloud select{width:100%;min-height:43px;padding:9px 11px;border:1px solid #b8c6d8;border-radius:10px;background:white;color:#172033}.storage-recovery-primary,.storage-recovery-secondary{min-height:43px;border-radius:10px;padding:0 15px;font-weight:800}.storage-recovery-primary{border:0;background:#1649b8;color:white}.storage-recovery-secondary{display:inline-flex;align-items:center;gap:7px;border:1px solid #c7d1df;background:white;color:#172033}.storage-recovery-secondary svg{width:16px}.storage-recovery-status,.storage-recovery-message{margin-top:16px;padding:12px 14px;border-radius:12px;font-size:12px;font-weight:700;line-height:1.5}.storage-recovery-status{display:flex;align-items:center;gap:9px;background:#eef3f9;color:#435268}.storage-recovery-status svg{width:17px}.storage-recovery-status.warning{background:#fff8e8;color:#81520c}.storage-recovery-message.success{background:#ecfaf5;color:#087055}.storage-recovery-message.danger{background:#fff1f3;color:#9d263b}.storage-recovery-footer{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:18px}.storage-recovery-footer>span{max-width:380px;color:#6d7887;font-size:10.5px;line-height:1.45;text-align:right}.storage-recovery-page button:disabled{opacity:.55;cursor:not-allowed}@media(prefers-color-scheme:dark){.storage-recovery-page{background:#10141b;color:#eef3fa}.storage-recovery-card{background:#171d26;border-color:#2b3442}.storage-recovery-title>span{background:#1b2e56;color:#79a3ff}.storage-recovery-title p,.storage-recovery-steps small,.storage-recovery-login small,.storage-recovery-cloud small,.storage-recovery-footer>span{color:#a7b2c1}.storage-recovery-error{background:#2a171b;border-color:#5f2932}.storage-recovery-error strong,.storage-recovery-error span{color:#ff9cad}.storage-recovery-steps>div,.storage-recovery-login,.storage-recovery-cloud{background:#1d2430;border-color:#303b4b}.storage-recovery-login input,.storage-recovery-cloud select,.storage-recovery-secondary{background:#121720;border-color:#3a4658;color:#edf3fb}.storage-recovery-status{background:#202936;color:#bdc8d6}.storage-recovery-status.warning{background:#312813;color:#f5cb72}.storage-recovery-message.success{background:#132d25;color:#8ae2c1}.storage-recovery-message.danger{background:#34191f;color:#ff9cad}}@media(max-width:650px){.storage-recovery-page{padding:16px}.storage-recovery-card{padding:21px}.storage-recovery-title h1{font-size:21px}.storage-recovery-steps{grid-template-columns:1fr}.storage-recovery-footer{align-items:stretch;flex-direction:column}.storage-recovery-footer>span{text-align:left}}
          ''')

          # 6) Copy do painel de sincronização: uma ação principal no uso normal.
          sync_panel_path = Path("src/cloud-sync-panel.tsx")
          panel = sync_panel_path.read_text(encoding="utf-8-sig")
          replacements = {
            'not_linked: { title: "Sincronização ainda não preparada", text: "Este computador ainda precisa fazer a primeira sincronização desta escola." }': 'not_linked: { title: "Primeira sincronização necessária", text: "Este computador ainda precisa escolher uma base segura para esta instituição." }',
            'synced: { title: "Tudo sincronizado", text: "Os dados deste computador e da nuvem estão atualizados." }': 'synced: { title: "Computador e nuvem estão iguais", text: "Na última verificação, as duas cópias estavam atualizadas." }',
            'local_changed: { title: "Há alterações neste computador", text: "Existem mudanças prontas para serem salvas na nuvem com segurança." }': 'local_changed: { title: "Há mudanças para enviar", text: "Elas já estão salvas neste computador. Sincronize para atualizar também a nuvem." }',
            'cloud_changed: { title: "Há novidades na nuvem", text: "Outro dispositivo ou uma automação atualizou dados da escola." }': 'cloud_changed: { title: "Há novidades para baixar", text: "A nuvem mudou em outro dispositivo ou automação. Sincronize para receber as alterações." }',
            'conflict: { title: "Precisamos escolher qual cópia manter", text: "Este computador e a nuvem foram alterados. O AulaFácil não apaga nenhum dos lados automaticamente." }': 'conflict: { title: "Mudanças nos dois lados", text: "Nada foi apagado. Escolha com cuidado qual cópia deve prevalecer." }',
            'SINCRONIZAÇÃO SEGURA': 'SINCRONIZAÇÃO COM A NUVEM',
            '>Usar dados da nuvem</button>': '>Usar cópia da nuvem</button>',
            '>Usar dados deste computador</button>': '>Manter cópia deste computador</button>',
            '<strong>Vamos guardar uma cópia antes de substituir os dados deste computador</strong>': '<strong>Antes de usar a nuvem, vamos proteger a cópia deste computador</strong>',
          }
          for old, new in replacements.items():
              if old in panel: panel = panel.replace(old, new)
          heading_end = '''      </div>\n\n      {!schoolId && <div className="cloud-sync-warning">'''
          if "cloud-sync-plain-note" not in panel:
              if heading_end not in panel: raise SystemExit("Não encontrei o cabeçalho da sincronização.")
              panel = panel.replace(heading_end, '''      </div>\n\n      <div className="cloud-sync-plain-note"><strong>No uso normal, é simples:</strong> clique apenas em “Sincronizar agora”. As opções de escolher uma cópia só aparecem quando existe algo que precisa da sua decisão.</div>\n\n      {!schoolId && <div className="cloud-sync-warning">''', 1)
          sync_panel_path.write_text(panel, encoding="utf-8")

          css_path = Path("src/cloud-sync-panel.css")
          css = css_path.read_text(encoding="utf-8-sig")
          if "CLOUD-CLARITY-2026" not in css:
              css += '''\n/* CLOUD-CLARITY-2026 */\n.cloud-sync-plain-note{margin:0 0 14px;padding:11px 13px;border:1px solid color-mix(in srgb,var(--blue) 20%,var(--border,var(--line)));border-radius:12px;background:color-mix(in srgb,var(--blue) 6%,var(--surface));color:var(--text-muted,var(--muted));font-size:11.5px;line-height:1.5}.cloud-sync-plain-note strong{color:var(--text)}\n'''
          css_path.write_text(css, encoding="utf-8")

          account_css = Path("src/cloud-account.css").read_text(encoding="utf-8-sig")
          if "CLOUD-ACCOUNT-CLARITY-2026" not in account_css:
              account_css += '''\n/* CLOUD-ACCOUNT-CLARITY-2026 */\n.cloud-account-guide{display:flex;gap:7px;flex-direction:column;margin:0 0 18px;padding:12px 14px;border:1px solid color-mix(in srgb,var(--blue) 18%,var(--border,var(--line)));border-radius:12px;background:color-mix(in srgb,var(--blue) 5%,var(--surface))}.cloud-account-guide strong{color:var(--text);font-size:12px}.cloud-account-guide span{color:var(--text-muted,var(--muted));font-size:11.5px;line-height:1.5}\n'''
          Path("src/cloud-account.css").write_text(account_css, encoding="utf-8")

          # 7) Integrar no app e nunca mais mostrar uma versão antiga fixa na lateral.
          app_path = Path("src/AppNext.tsx")
          app = app_path.read_text(encoding="utf-8-sig")
          if 'import packageInfo from "../package.json";' not in app:
              app = 'import packageInfo from "../package.json";\n' + app
          if 'import { DataSafetyPanel } from "./data-safety-panel";' not in app:
              app = app.replace('import { CloudSyncPanel } from "./cloud-sync-panel";\n', 'import { CloudSyncPanel } from "./cloud-sync-panel";\nimport { DataSafetyPanel } from "./data-safety-panel";\n', 1)
          app = app.replace('{ id: "cloud" as View, label: "Conta e sincronização", icon: Cloud }', '{ id: "cloud" as View, label: "Nuvem e salvamento", icon: Cloud }')
          app = app.replace('cloud: { title: "Conta e sincronização", description: "Entre na conta e mantenha os dados deste computador alinhados com a nuvem." }', 'cloud: { title: "Nuvem e salvamento", description: "Veja o que está salvo neste computador, o estado da nuvem e quando sincronizar." }')
          app = app.replace('<div className="version">AulaFácil Desktop <span>v0.4.4</span></div>', '<div className="version">AulaFácil Desktop <span>v{packageInfo.version}</span></div>')
          old_cloud = '{view === "cloud" && <section className="stack cloud-hub-page"><CloudAccountPanel database={database} onReplaceDatabase={setDatabase}/><CloudSyncPanel database={database} onReplaceDatabase={setDatabase}/></section>}'
          new_cloud = '{view === "cloud" && <section className="stack cloud-hub-page"><DataSafetyPanel database={database} onOpenBackup={() => changeView("backup")}/><CloudAccountPanel database={database}/><CloudSyncPanel database={database} onReplaceDatabase={setDatabase}/></section>}'
          if old_cloud not in app: raise SystemExit("Não encontrei a montagem atual da página Cloud.")
          app = app.replace(old_cloud, new_cloud, 1)
          app = app.replace('Abra “Conta e nuvem” e sincronize este computador', 'Abra “Nuvem e salvamento” e sincronize este computador')
          app_path.write_text(app, encoding="utf-8")

          # 8) Guardas de qualidade para impedir regressão desses pontos.
          quality_path = Path("scripts/quality-check.mjs")
          quality = quality_path.read_text(encoding="utf-8-sig")
          quality_anchor = 'const textLayoutSafety = exists("src/text-layout-hardening.css") ? read("src/text-layout-hardening.css") : "";\n'
          quality_add = '''const cloudAccountSource = read("src/cloud-account.tsx");\nconst cloudSyncSource = read("src/cloud-sync-panel.tsx");\nconst storageSource = read("src/storage.ts");\nconst recoverySource = read("src/storage-recovery-screen.tsx");\nconst appNextSource = read("src/AppNext.tsx");\n'''
          if "const cloudAccountSource" not in quality:
              quality = quality.replace(quality_anchor, quality_anchor + quality_add, 1)
          check_anchor = 'const cargoVersion = cargo.match(/^version\\s*=\\s*"([^\"]+)"/m)?.[1];\n'
          checks = '''\nif (cloudAccountSource.includes("safePullFromCloud") || cloudAccountSource.includes("safePushToCloud")) failures.push("Conta e instituição voltou a duplicar ações de sincronização perigosas.");\nif (!cloudSyncSource.includes("No uso normal, é simples")) failures.push("O painel Cloud perdeu a orientação simples de sincronização.");\nif (!storageSource.includes("aulafacil:storage-state") || !storageSource.includes("getLocalStorageState")) failures.push("A interface não consegue mais mostrar o estado real do salvamento local.");\nif (!recoverySource.includes("signInCloud") || !recoverySource.includes("selectedSchoolId")) failures.push("A tela de recuperação voltou a ter beco sem saída para login ou múltiplas instituições.");\nif (!exists("src/data-safety-panel.tsx") || !exists("src/data-safety-panel.css")) failures.push("O resumo didático de computador, nuvem e backup está ausente.");\nif (!appNextSource.includes('import packageInfo from "../package.json"') || appNextSource.includes("v0.4.4")) failures.push("A versão exibida no aplicativo pode ficar desatualizada novamente.");\n'''
          if "Conta e instituição voltou a duplicar" not in quality:
              quality = quality.replace(check_anchor, check_anchor + checks, 1)
          quality_path.write_text(quality, encoding="utf-8")

      - name: Instalar dependências
        run: npm ci --no-audit

      - name: Executar testes
        run: npm test

      - name: Validar frontend
        run: npm run build

      - name: Validar estrutura de release
        shell: bash
        run: AULAFACIL_STRICT_RELEASE=1 node scripts/quality-check.mjs

      - name: Gerar recursos Tauri
        run: npm run desktop:icons

      - name: Validar backend desktop no Windows
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Verificar pontos críticos da revisão
        shell: bash
        run: |
          grep -q 'Nuvem e salvamento' src/AppNext.tsx
          grep -q 'aulafacil:storage-state' src/storage.ts
          grep -q 'signInCloud' src/storage-recovery-screen.tsx
          ! grep -q 'safePullFromCloud' src/cloud-account.tsx
          ! grep -q 'safePushToCloud' src/cloud-account.tsx

      - name: Publicar revisão validada
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/review-stability-cloud.yml
          git add -A
          git commit -m "fix: simplificar nuvem e reforçar salvamento e recuperação"
          git push origin HEAD:main
