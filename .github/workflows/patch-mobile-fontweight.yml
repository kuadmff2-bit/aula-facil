name: Corrigir tipagem inicial do AulaFácil Mobile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-mobile-fontweight.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Corrigir peso de fonte incompatível com React Native
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mobile/App.tsx')
          s = p.read_text(encoding='utf-8')
          if 'fontWeight: "850"' not in s:
              raise SystemExit('Marcador esperado não encontrado')
          s = s.replace('fontWeight: "850"', 'fontWeight: "800"')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validar TypeScript do mobile
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
      - name: Commitar correção
        run: |
          git config user.name "kuadm"
          git config user.email "kuadmff2@gmail.com"
          git add mobile/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: corrigir tipagem visual do AulaFácil Mobile"
          git push origin HEAD:main
