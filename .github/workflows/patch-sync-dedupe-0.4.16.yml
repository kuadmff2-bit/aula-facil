name: Corrigir sincronização financeira 0.4.16

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-sync-dedupe-0.4.16.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Integrar deduplicação e atualizar versão
        run: |
          python scripts/patch-sync-dedupe-0.4.16.py
          npm install --package-lock-only --ignore-scripts
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path('src-tauri/Cargo.lock')
          text = path.read_text(encoding='utf-8')
          pattern = r'(\[\[package\]\]\nname = "aula-facil"\nversion = ")[^"]+("\n)'
          text, count = re.subn(pattern, r'\g<1>0.4.16\g<2>', text, count=1)
          if count != 1:
              raise SystemExit('Pacote aula-facil não encontrado em Cargo.lock')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Validar frontend
        run: npm run build

      - name: Validar Cargo lock
        working-directory: src-tauri
        run: cargo metadata --format-version 1 --locked --no-deps >/dev/null

      - name: Conferir integração
        run: |
          grep -q 'normalizeFinanceSnapshotForSync' src/cloud-safe-sync.ts
          test "$(node -p "require('./package.json').version")" = "0.4.16"
          test "$(node -p "require('./package-lock.json').version")" = "0.4.16"
          test "$(node -p "require('./src-tauri/tauri.conf.json').version")" = "0.4.16"
          grep -q '^version = "0.4.16"' src-tauri/Cargo.toml

      - name: Commitar correção validada
        run: |
          git config user.name "kuadm"
          git config user.email "kuadmff2@gmail.com"
          git add src/cloud-safe-sync.ts package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "release: AulaFácil 0.4.16 corrige duplicatas na sincronização"
          git push origin HEAD:main
