name: Concluir estabilidade AulaFácil 0.4.8

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-stability-0.4.8.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Aplicar correções finais de integridade
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8-sig")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Trecho não encontrado: {label}")
              return text.replace(old, new, 1)

          def sub_once(text, pattern, replacement, label):
              result, count = re.subn(pattern, lambda _m: replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Substituição falhou ({count}): {label}")
              return result

          # -----------------------------------------------------------------
          # Sincronização: primeiro envio seguro + fila de exclusões explícitas
          # -----------------------------------------------------------------
          path = "src/cloud-safe-sync.ts"
          text = read(path)
          text = replace_once(
              text,
              'import { cloud, downloadCloudDatabase, getCloudDataSummary, seedEmptyCloudFromLocal } from "./cloud";',
              'import { cloud, downloadCloudDatabase, getCloudDataSummary } from "./cloud";',
              "remover rotina antiga do import",
          )

          marker = 'const pushAttemptKey = (schoolId: string) => `aulafacil.cloud.push-attempt.${schoolId}`;\n'
          tombstones = '''const pushAttemptKey = (schoolId: string) => `aulafacil.cloud.push-attempt.${schoolId}`;
          const pendingDeletionKey = (schoolId: string) => `aulafacil.cloud.pending-deletions.${schoolId}`;

          export type CloudDeletionTable = "students" | "classes" | "student_fields" | "notices" | "attendance" | "grades" | "invoices";
          type PendingCloudDeletion = { table: CloudDeletionTable; id: string; queuedAt: string };

          function readPendingCloudDeletions(schoolId: string): PendingCloudDeletion[] {
            if (!schoolId) return [];
            try {
              const raw = localStorage.getItem(pendingDeletionKey(schoolId));
              if (!raw) return [];
              const parsed = JSON.parse(raw);
              if (!Array.isArray(parsed)) return [];
              return parsed.filter((item): item is PendingCloudDeletion => Boolean(item)
                && typeof item.id === "string"
                && typeof item.queuedAt === "string"
                && ["students", "classes", "student_fields", "notices", "attendance", "grades", "invoices"].includes(item.table));
            } catch { return []; }
          }

          function writePendingCloudDeletions(schoolId: string, items: PendingCloudDeletion[]) {
            if (!schoolId) return;
            if (!items.length) localStorage.removeItem(pendingDeletionKey(schoolId));
            else localStorage.setItem(pendingDeletionKey(schoolId), JSON.stringify(items));
          }

          export function queueCloudDeletion(table: CloudDeletionTable, id: string) {
            const schoolId = localStorage.getItem(SELECTED_SCHOOL_KEY) ?? "";
            if (!schoolId || !id) return;
            const current = readPendingCloudDeletions(schoolId);
            if (current.some((item) => item.table === table && item.id === id)) return;
            current.push({ table, id, queuedAt: new Date().toISOString() });
            writePendingCloudDeletions(schoolId, current);
          }

          export function clearSelectedSchoolPendingCloudDeletions() {
            const schoolId = localStorage.getItem(SELECTED_SCHOOL_KEY) ?? "";
            if (schoolId) localStorage.removeItem(pendingDeletionKey(schoolId));
          }

          async function flushPendingCloudDeletions(schoolId: string) {
            const pending = readPendingCloudDeletions(schoolId);
            if (!pending.length) return 0;
            const grouped = new Map<CloudDeletionTable, string[]>();
            for (const item of pending) grouped.set(item.table, [...(grouped.get(item.table) ?? []), item.id]);
            let processed = 0;
            for (const [table, ids] of grouped) {
              const { error } = await cloud.rpc("aulafacil_explicit_soft_delete", {
                p_school_id: schoolId,
                p_table: table,
                p_ids: ids,
              });
              if (error) throw new Error(`Não foi possível concluir uma exclusão confirmada (${table}): ${error.message}`);
              processed += ids.length;
            }
            writePendingCloudDeletions(schoolId, []);
            return processed;
          }
          '''
          text = replace_once(text, marker, tombstones, "fila de exclusões explícitas")

          text = sub_once(
              text,
              r'\s*if \(firstSync && summary\.totalOperationalRecords === 0\) \{\s*await seedEmptyCloudFromLocal\(schoolId, normalized\);\s*\}\s*const pushed = await pushSnapshot\(schoolId, normalized, role\);',
              '''
              // A primeira sincronização usa o mesmo snapshot granular das demais.
              // Nenhuma limpeza genérica é feita antes do envio.
              const pushed = await pushSnapshot(schoolId, normalized, role);
              await flushPendingCloudDeletions(schoolId);''',
              "primeira sincronização sem limpeza antiga",
          )

          text = sub_once(
              text,
              r'export async function replaceCloudWithLocal\(schoolId: string, database: SchoolDatabase\) \{.*?\n\}',
              '''export async function replaceCloudWithLocal(schoolId: string, database: SchoolDatabase) {
            const role = await getCloudSyncRole(schoolId);
            if (!isAdmin(role)) throw new Error("Somente proprietário ou administrador pode aplicar alterações deste computador durante um conflito.");
            await pushSnapshot(schoolId, database, role);
            await flushPendingCloudDeletions(schoolId);
            clearPushAttempt(schoolId);
            // Depois de aplicar as alterações locais, baixa novamente a cópia final.
            // Registros existentes apenas na nuvem são preservados; exclusões confirmadas são respeitadas.
            return safePullFromCloud(schoolId, database.settings.appearance);
          }''',
              "resolução segura de conflito",
          )

          text = replace_once(
              text,
              '''  writeBaseline(schoolId, await getCloudRevision(schoolId), database, role);
            return database;
          }

          export async function reconcileCloud''',
              '''  writeBaseline(schoolId, await getCloudRevision(schoolId), database, role);
            writePendingCloudDeletions(schoolId, []);
            return database;
          }

          export async function reconcileCloud''',
              "descartar exclusões pendentes ao escolher a nuvem",
          )
          write(path, text)

          # -----------------------------------------------------------------
          # App principal: chamadas estáveis, exclusões seguras e reset local
          # -----------------------------------------------------------------
          path = "src/AppNext.tsx"
          text = read(path)
          text = replace_once(
              text,
              'import { getCloudSyncStatus, safePullFromCloud } from "./cloud-safe-sync";',
              'import { clearSelectedSchoolPendingCloudDeletions, getCloudSyncStatus, invalidateSelectedSchoolSyncBaseline, queueCloudDeletion, safePullFromCloud } from "./cloud-safe-sync";',
              "imports de segurança da nuvem",
          )

          text = sub_once(
              text,
              r'  const saveClassAttendance = \(classId: string, date: string, marks: Record<string, "present" \| "absent">\) => \{.*?\n  \};',
              '''  const saveClassAttendance = (classId: string, date: string, marks: Record<string, "present" | "absent">) => {
            updateDatabase((draft) => {
              for (const [studentId, status] of Object.entries(marks)) {
                const existing = draft.attendance.find((item) => item.classId === classId && item.date === date && item.studentId === studentId);
                if (existing) existing.status = status;
                else draft.attendance.push({ id: makeId("presenca"), studentId, classId, date, status });
              }
            });
            notify("Chamada salva.");
          };''',
              "atualizar chamada sem recriar IDs",
          )

          text = sub_once(
              text,
              r'  const deleteStudent = \(student: Student\) => confirmAction\(\{.*?\n  \}\);',
              '''  const deleteStudent = (student: Student) => {
            const hasAcademicHistory = database.attendance.some((item) => item.studentId === student.id)
              || database.grades.some((item) => item.studentId === student.id);
            const hasPaymentHistory = database.payments.some((item) => item.studentId === student.id);
            if (hasAcademicHistory || hasPaymentHistory) {
              notify("Este aluno já possui histórico acadêmico ou de pagamentos. Para preservar os registros, tranque a matrícula em vez de excluir o cadastro.", "warning");
              return;
            }
            confirmAction({
              title: "Excluir este aluno?",
              message: `O cadastro de ${student.name} será removido deste computador e, na próxima sincronização, também da nuvem.`,
              detail: "Mensalidades ainda sem pagamento ligadas a este cadastro também serão removidas. Esta opção é indicada apenas para cadastros criados por engano.",
              confirmLabel: "Excluir cadastro",
              tone: "danger",
            }, () => {
              const invoiceIds = database.invoices.filter((item) => item.studentId === student.id).map((item) => item.id);
              queueCloudDeletion("students", student.id);
              invoiceIds.forEach((id) => queueCloudDeletion("invoices", id));
              updateDatabase((draft) => {
                draft.students = draft.students.filter((item) => item.id !== student.id);
                draft.invoices = draft.invoices.filter((item) => item.studentId !== student.id);
              });
              setSelectedStudentId("");
              notify("Cadastro removido. A exclusão na nuvem será concluída na próxima sincronização.", "warning");
            });
          };''',
              "exclusão segura do aluno",
          )

          text = sub_once(
              text,
              r'  const deleteClass = \(classItem: ClassItem\) => \{.*?\n  \};',
              '''  const deleteClass = (classItem: ClassItem) => {
            if (database.students.some((student) => student.classId === classItem.id)) {
              notify("Esta turma ainda possui alunos. Mova os alunos para outra turma antes de excluí-la.", "warning");
              return;
            }
            const hasAcademicHistory = database.attendance.some((item) => item.classId === classItem.id)
              || database.grades.some((item) => item.classId === classItem.id);
            if (hasAcademicHistory) {
              notify("Esta turma possui histórico de chamadas ou notas e será mantida para não perder registros acadêmicos.", "warning");
              return;
            }
            confirmAction({
              title: "Excluir esta turma?",
              message: `${classItem.name}${classItem.groupName ? ` · ${classItem.groupName}` : ""} será removida deste computador e da nuvem na próxima sincronização.`,
              confirmLabel: "Excluir turma",
              tone: "danger",
            }, () => {
              queueCloudDeletion("classes", classItem.id);
              updateDatabase((draft) => { draft.classes = draft.classes.filter((item) => item.id !== classItem.id); });
              notify("Turma removida. A nuvem será atualizada na próxima sincronização.", "warning");
            });
          };''',
              "proteção do histórico da turma",
          )

          text = replace_once(
              text,
              '<StudentFieldsSettings fields={database.settings.studentFields} onChange={(fields) => updateDatabase((draft) => { draft.settings.studentFields = fields; })}/>',
              '''<StudentFieldsSettings fields={database.settings.studentFields} onChange={(fields) => {
                const nextIds = new Set(fields.map((field) => field.id));
                const removedIds = database.settings.studentFields.filter((field) => !nextIds.has(field.id)).map((field) => field.id);
                removedIds.forEach((id) => queueCloudDeletion("student_fields", id));
                updateDatabase((draft) => {
                  draft.settings.studentFields = fields;
                  for (const student of draft.students) {
                    for (const id of removedIds) delete student.customFields[id];
                  }
                });
              }}/>
              ''',
              "remoção explícita de campos personalizados",
          )

          text = sub_once(
              text,
              r'\{view === "backup" && <BackupPanel database=\{database\}.*?onNotify=\{notify\}/>}\s*',
              '''{view === "backup" && <BackupPanel database={database} onRestoreCandidate={(restored) => confirmAction({ title:"Restaurar este backup?", message:"Os dados deste computador serão substituídos pelo arquivo validado. A nuvem não será alterada até uma sincronização posterior.", confirmLabel:"Restaurar backup", tone:"warning" }, () => { invalidateSelectedSchoolSyncBaseline(); clearSelectedSchoolPendingCloudDeletions(); setDatabase(restored); setSelectedStudentId(""); notify("Backup restaurado neste computador. Confira Nuvem e salvamento antes de sincronizar.", "warning"); })} onReset={() => confirmAction({ title:"Apagar dados deste computador?", message:"Isso apaga apenas a cópia local deste Windows. Os dados do AulaFácil Cloud e seus arquivos de backup não serão apagados.", detail:"Depois disso, este computador precisará recuperar ou iniciar novamente a sincronização antes de enviar dados para a nuvem.", confirmLabel:"Apagar só deste computador", tone:"danger" }, () => { invalidateSelectedSchoolSyncBaseline(); clearSelectedSchoolPendingCloudDeletions(); setDatabase(emptyDatabase()); setSelectedStudentId(""); notify("Dados deste computador apagados. A nuvem não foi alterada.","warning"); })} onNotify={notify}/>} 
              ''',
              "reset e restauração apenas locais",
          )
          write(path, text)

          # -----------------------------------------------------------------
          # Avisos: exclusão confirmada vira tombstone explícito
          # -----------------------------------------------------------------
          path = "src/notices-center.tsx"
          text = read(path)
          text = replace_once(
              text,
              'import { cloud } from "./cloud";',
              'import { cloud } from "./cloud";\nimport { queueCloudDeletion } from "./cloud-safe-sync";',
              "import tombstone de avisos",
          )
          text = replace_once(
              text,
              '''    const next = structuredClone(database);
              next.notices = next.notices.filter((item) => item.id !== id);''',
              '''    queueCloudDeletion("notices", id);
              const next = structuredClone(database);
              next.notices = next.notices.filter((item) => item.id !== id);''',
              "exclusão explícita do aviso",
          )
          text = replace_once(text, 'notify("Aviso removido do mural.", "warning");', 'notify("Aviso removido. A nuvem será atualizada na próxima sincronização.", "warning");', "mensagem de aviso removido")
          write(path, text)

          # -----------------------------------------------------------------
          # Backup: linguagem simples
          # -----------------------------------------------------------------
          path = "src/backup-panel.tsx"
          text = read(path)
          text = replace_once(text, '<h2>Backup portátil criptografado</h2>', '<h2>Backup protegido por senha</h2>', "título backup")
          text = replace_once(text, 'O arquivo .afbackup usa AES-256-GCM e uma chave derivada da senha escolhida. Ele pode ser levado para outro computador sem depender da proteção DPAPI do Windows deste dispositivo.', 'Crie uma cópia extra dos dados da escola para guardar em outro local ou recuperar em outro computador. O arquivo só pode ser aberto com a senha que você escolher.', "texto backup")
          text = replace_once(text, '<h3>Criar .afbackup</h3>', '<h3>Criar backup protegido</h3>', "criar backup")
          text = replace_once(text, '<p><strong>Recomendação:</strong> mantenha pelo menos duas cópias em locais diferentes e teste a restauração periodicamente. O Cloud ajuda na continuidade, mas não substitui um backup independente.</p>', '<p><strong>Recomendação:</strong> use a nuvem para manter os dispositivos alinhados e guarde também um backup protegido em outro local. Assim você tem duas formas diferentes de recuperar seus dados.</p>', "recomendação")
          text = replace_once(text, '<div className="danger-zone card"><div><h3>Apagar todos os dados locais</h3><p>Use apenas para reiniciar esta instalação. Dados já existentes no Cloud não devem ser tratados como apagados até a sincronização confirmar a operação.</p></div><button className="danger-button" onClick={onReset}><Trash2 size={18} /> Limpar sistema</button></div>', '<div className="danger-zone card"><div><h3>Apagar dados deste computador</h3><p>Remove somente a cópia salva neste Windows. Os dados do AulaFácil Cloud e seus arquivos de backup não são apagados por esta ação.</p></div><button className="danger-button" onClick={onReset}><Trash2 size={18} /> Apagar deste computador</button></div>', "zona de perigo")
          write(path, text)

          # -----------------------------------------------------------------
          # Painel de nuvem: termos coerentes e conflito como mesclagem segura
          # -----------------------------------------------------------------
          path = "src/cloud-sync-panel.tsx"
          text = read(path)
          text = text.replace("Conta e sincronização", "Nuvem e salvamento")
          text = text.replace("Manter cópia deste computador", "Manter minhas alterações")
          text = text.replace("Pronto. Os dados deste computador foram mantidos e a nuvem foi atualizada.", "Pronto. Suas alterações foram aplicadas e a cópia final foi conferida com a nuvem.")
          text = text.replace("Manter os dados deste computador?", "Aplicar as alterações deste computador?")
          text = text.replace("O AulaFácil vai usar esta cópia como a correta e atualizar a nuvem. Faça isso somente se os dados deste computador forem os que você quer manter.", "O AulaFácil vai aplicar as alterações deste computador sem apagar registros que existam somente na nuvem. Exclusões que você confirmou serão respeitadas.")
          text = text.replace("Sim, manter estes dados", "Aplicar minhas alterações")
          write(path, text)

      - name: Instalar dependências
        run: npm ci --no-audit

      - name: Executar testes
        run: npm test

      - name: Validar TypeScript e frontend
        run: npm run build

      - name: Validar estrutura de release
        shell: bash
        run: AULAFACIL_STRICT_RELEASE=1 node scripts/quality-check.mjs

      - name: Gerar recursos Tauri
        run: npm run desktop:icons

      - name: Validar backend desktop no Windows
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Auditar correções finais
        shell: bash
        run: |
          ! grep -q 'seedEmptyCloudFromLocal' src/cloud-safe-sync.ts
          grep -q 'aulafacil_explicit_soft_delete' src/cloud-safe-sync.ts
          grep -q 'queueCloudDeletion("students"' src/AppNext.tsx
          grep -q 'queueCloudDeletion("classes"' src/AppNext.tsx
          grep -q 'queueCloudDeletion("notices"' src/notices-center.tsx
          grep -q 'Apagar só deste computador' src/AppNext.tsx
          grep -q 'Apagar dados deste computador' src/backup-panel.tsx
          grep -q 'if (existing) existing.status = status' src/AppNext.tsx

      - name: Publicar somente depois de tudo passar
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cloud-safe-sync.ts src/AppNext.tsx src/notices-center.tsx src/backup-panel.tsx src/cloud-sync-panel.tsx
          git commit -m "fix: concluir integridade de nuvem e exclusões explícitas"
          git push origin HEAD:main
