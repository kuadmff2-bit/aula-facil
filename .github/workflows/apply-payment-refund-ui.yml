name: Apply payment refund UI

on:
  push:
    branches: [hardening-backend-0.4.13]
    paths:
      - .github/workflows/apply-payment-refund-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-backend-0.4.13
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply deterministic refund patch
        run: python scripts/apply-payment-refund-ui.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit refund UI
        run: |
          git config user.name "kuadm"
          git config user.email "kuadmff2@gmail.com"
          git add src/billing.ts src/model.ts src/cloud.ts src/finance-ultimate.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: add safe provider payment refunds"
          git push origin HEAD:hardening-backend-0.4.13
