name: Sincronizar versão do lockfile

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - src-tauri/Cargo.toml
      - src-tauri/tauri.conf.json
      - .github/workflows/sync-version-lock.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-version-lock-main
  cancel-in-progress: false

jobs:
  sync:
    name: Manter versões alinhadas
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Sincronizar metadados do package-lock
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = pkg.version;
          if (!lock.packages || !lock.packages['']) throw new Error('package-lock.json não possui o pacote raiz.');
          lock.packages[''].version = pkg.version;
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          NODE

      - name: Publicar correção quando necessária
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json já está sincronizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Sincronizar versão do package-lock"
          git push
