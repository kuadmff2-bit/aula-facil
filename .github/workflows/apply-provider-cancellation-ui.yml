name: Apply provider-aware cancellation UI

on:
  push:
    branches: [hardening-backend-0.4.13]
    paths:
      - .github/workflows/apply-provider-cancellation-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-backend-0.4.13
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch finance UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/finance-ultimate.tsx')
          s = p.read_text(encoding='utf-8')

          old = 'import { emptyBillingProfile, generateProviderCharge, getBillingProfile, saveBillingProfile, type BillingProfile, type GeneratedCharge } from "./billing";'
          new = 'import { cancelProviderCharge, emptyBillingProfile, generateProviderCharge, getBillingProfile, saveBillingProfile, type BillingProfile, type GeneratedCharge } from "./billing";'
          if old not in s:
              raise SystemExit('billing import anchor not found')
          s = s.replace(old, new, 1)

          old = '  const [reopenArmed, setReopenArmed] = useState("");\n  const [query, setQuery] = useState("");'
          new = '  const [reopenArmed, setReopenArmed] = useState("");\n  const [cancelArmed, setCancelArmed] = useState("");\n  const [reissueArmed, setReissueArmed] = useState("");\n  const [query, setQuery] = useState("");'
          if old not in s:
              raise SystemExit('state anchor not found')
          s = s.replace(old, new, 1)

          old = '''  const cancelInvoice = (invoice: Invoice) => {
    if (invoice.status === "paid") return;
    onChange(replaceDatabase(database, (draft) => {
      const target = draft.invoices.find((item) => item.id === invoice.id);
      if (!target) return;
      target.status = "cancelled";
      target.cancelledAt = new Date().toISOString();
      target.cancellationReason = "Cancelada manualmente no financeiro";
    }));
    setNotice({ tone: "warning", text: "Cobrança cancelada. O histórico foi preservado." });
  };'''
          new = '''  const cancelInvoice = (invoice: Invoice) => void (async () => {
    if (invoice.status === "paid" || busy) return;
    if (cancelArmed !== invoice.id) {
      setCancelArmed(invoice.id);
      setReissueArmed("");
      setNotice({ tone: "warning", text: `Clique novamente em “Confirmar cancelamento” para cancelar ${invoice.reference}. Se existir Pix ou boleto, ele será cancelado primeiro no provedor.` });
      return;
    }

    const schoolId = localStorage.getItem(SELECTED_SCHOOL_KEY) ?? "";
    const hasExternalCharge = Boolean(invoice.providerChargeId || invoice.pixCopyPaste || invoice.boletoUrl || invoice.paymentUrl);
    setBusy(true);
    setNotice(null);
    try {
      if (schoolId) {
        const syncStatus = await getCloudSyncStatus(schoolId, database);
        if (syncStatus !== "synced") throw new Error("Sincronize este computador antes de cancelar a mensalidade. O cancelamento foi bloqueado para não deixar Pix ou boleto ativo no provedor.");
        const result = await cancelProviderCharge({ invoiceId: invoice.id, cancelInvoice: true, reason: "Cancelada manualmente no financeiro" });
        onChange(await safePullFromCloud(schoolId, database.settings.appearance));
        setNotice({ tone: "success", text: result.providerChargeCancelled
          ? "Mensalidade cancelada. A cobrança bancária também foi cancelada no provedor e o histórico foi preservado."
          : "Mensalidade cancelada com segurança. Não havia cobrança bancária externa ativa." });
      } else {
        if (hasExternalCharge) throw new Error("Esta mensalidade possui uma cobrança bancária vinculada. Conecte o AulaFácil Cloud para cancelar primeiro no provedor.");
        onChange(replaceDatabase(database, (draft) => {
          const target = draft.invoices.find((item) => item.id === invoice.id);
          if (!target) return;
          target.status = "cancelled";
          target.cancelledAt = new Date().toISOString();
          target.cancellationReason = "Cancelada manualmente no financeiro em modo local";
        }));
        setNotice({ tone: "warning", text: "Mensalidade local cancelada. Não havia cobrança bancária vinculada." });
      }
      setCancelArmed("");
    } catch (error) {
      setNotice({ tone: "danger", text: error instanceof Error ? error.message : "Não foi possível cancelar a mensalidade." });
    } finally { setBusy(false); }
  })();

  const removeProviderChargeForReissue = () => void (async () => {
    if (!modal || modal.kind !== "charge" || busy) return;
    if (reissueArmed !== modal.invoice.id) {
      setReissueArmed(modal.invoice.id);
      setCancelArmed("");
      setNotice({ tone: "warning", text: "Clique novamente em “Confirmar remoção” para cancelar a cobrança bancária atual no provedor. A mensalidade continuará em aberto e poderá receber um novo Pix ou boleto." });
      return;
    }
    const schoolId = localStorage.getItem(SELECTED_SCHOOL_KEY) ?? "";
    if (!schoolId) {
      setNotice({ tone: "danger", text: "Conecte o AulaFácil Cloud para remover uma cobrança bancária antes da reemissão." });
      return;
    }
    setBusy(true);
    try {
      const syncStatus = await getCloudSyncStatus(schoolId, database);
      if (syncStatus !== "synced") throw new Error("Sincronize este computador antes de remover a cobrança bancária para reemissão.");
      const result = await cancelProviderCharge({ invoiceId: modal.invoice.id, cancelInvoice: false, reason: "Cobrança bancária removida para reemissão" });
      const restored = await safePullFromCloud(schoolId, database.settings.appearance);
      onChange(restored);
      const refreshed = restored.invoices.find((item) => item.id === modal.invoice.id);
      if (refreshed) setModal({ ...modal, invoice: refreshed });
      setGeneratedCharge(null);
      setReissueArmed("");
      setNotice({ tone: "success", text: result.providerChargeCancelled
        ? "Cobrança bancária anterior cancelada no provedor. A mensalidade continua em aberto e já pode receber um novo Pix ou boleto."
        : "O vínculo bancário foi limpo com segurança. A mensalidade continua em aberto e pode ser reemitida." });
    } catch (error) {
      setNotice({ tone: "danger", text: error instanceof Error ? error.message : "Não foi possível preparar a reemissão." });
    } finally { setBusy(false); }
  })();'''
          if old not in s:
              raise SystemExit('cancel function anchor not found')
          s = s.replace(old, new, 1)

          old = '<button className="text-button" onClick={() => cancelInvoice(invoice)}>Cancelar</button>'
          new = '<button className="text-button" disabled={busy} onClick={() => cancelInvoice(invoice)}>{cancelArmed === invoice.id ? "Confirmar cancelamento" : "Cancelar"}</button>'
          if old not in s:
              raise SystemExit('cancel button anchor not found')
          s = s.replace(old, new, 1)

          old = '<button aria-label="Fechar aviso" onClick={() => { setNotice(null); setReopenArmed(""); }}><X size={15}/></button>'
          new = '<button aria-label="Fechar aviso" onClick={() => { setNotice(null); setReopenArmed(""); setCancelArmed(""); setReissueArmed(""); }}><X size={15}/></button>'
          if old not in s:
              raise SystemExit('notice close anchor not found')
          s = s.replace(old, new, 1)

          old = '<div className="form-actions"><button className="secondary-button" onClick={() => { setModal(null); setNotice(null); }}>Fechar</button><button className="primary-button" disabled={busy} aria-busy={busy} onClick={() => void generateCharge()}>{busy ? `Gerando ${chargeMethod === "pix" ? "Pix" : "boleto"}...` : `Gerar ${chargeMethod === "pix" ? "Pix" : "boleto"}`}</button></div>'
          new = '<div className="form-actions">{(modal.invoice.providerChargeId || modal.invoice.pixCopyPaste || modal.invoice.boletoUrl || modal.invoice.paymentUrl || generatedCharge?.providerChargeId) && <button className="danger-button" disabled={busy} onClick={() => removeProviderChargeForReissue()}>{reissueArmed === modal.invoice.id ? "Confirmar remoção" : "Remover cobrança atual para reemitir"}</button>}<button className="secondary-button" onClick={() => { setModal(null); setNotice(null); setReissueArmed(""); }}>Fechar</button><button className="primary-button" disabled={busy} aria-busy={busy} onClick={() => void generateCharge()}>{busy ? `Gerando ${chargeMethod === "pix" ? "Pix" : "boleto"}...` : `Gerar ${chargeMethod === "pix" ? "Pix" : "boleto"}`}</button></div>'
          if old not in s:
              raise SystemExit('charge actions anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit patched finance UI
        run: |
          git config user.name "kuadm"
          git config user.email "kuadmff2@gmail.com"
          git add src/finance-ultimate.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: cancel provider charge before invoice cancellation"
          git push origin HEAD:hardening-backend-0.4.13
