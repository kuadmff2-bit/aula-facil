name: Gerar APK do AulaFácil Mobile

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-mobile-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aulafacil-mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Validar e gerar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Validar TypeScript
        run: npm run typecheck

      - name: Gerar projeto Android nativo
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Compilar APK instalável
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Preparar nome amigável
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AulaFacil-Mobile-Android.apk

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: AulaFacil-Mobile-Android
          path: mobile/AulaFacil-Mobile-Android.apk
          if-no-files-found: error
          retention-days: 30
