# AulaFácil Mobile 0.2.1 - build final com navegação Android corrigida
name: Gerar APK do AulaFácil Mobile

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-mobile-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aulafacil-mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Validar e gerar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Validar TypeScript
        run: npm run typecheck

      - name: Gerar identidade visual
        run: node scripts/generate-assets.cjs

      - name: Validar ícone e capa
        run: |
          test -s assets/icon.png
          test -s assets/adaptive-icon.png
          test -s assets/splash.png
          echo "Ícone e capa confirmados."

      - name: Gerar projeto Android nativo
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Compilar APK Release autônomo
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Validar bundle JavaScript dentro do APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q "assets/index.android.bundle"
          echo "Bundle JavaScript confirmado dentro do APK."

      - name: Preparar nome amigável
        run: cp android/app/build/outputs/apk/release/app-release.apk AulaFacil-Mobile-Android-0.2.1.apk

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: AulaFacil-Mobile-Android-0.2.1
          path: mobile/AulaFacil-Mobile-Android-0.2.1.apk
          if-no-files-found: error
          retention-days: 30
