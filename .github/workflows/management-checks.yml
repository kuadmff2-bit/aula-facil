name: Validar gestão conectada
on:
  pull_request:
  push:
    branches: [main, develop, 'rebuild/**']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/quality-check.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
