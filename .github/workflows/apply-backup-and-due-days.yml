name: Integrar backup protegido e vencimentos individuais

on:
  push:
    branches: [develop]
    paths:
      - "scripts/apply-backup-and-due-days.py"
      - ".github/workflows/apply-backup-and-due-days.yml"

permissions:
  contents: write

concurrency:
  group: apply-backup-and-due-days
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - name: Baixar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependências
        run: npm ci

      - name: Aplicar integração
        run: python scripts/apply-backup-and-due-days.py

      - name: Verificar estrutura
        run: node scripts/quality-check.mjs

      - name: Executar testes
        run: npm test

      - name: Validar frontend
        run: npm run build

      - name: Gerar recursos Tauri
        run: npm run desktop:icons

      - name: Validar Tauri
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Publicar somente se tudo passou
        shell: bash
        run: |
          if git diff --quiet -- src/App.tsx; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Integrar backup criptografado e vencimentos individuais"
          git fetch origin develop
          git rebase origin/develop
          git push origin HEAD:develop

# Reexecutado após validação dos testes de backup.
