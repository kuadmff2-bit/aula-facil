name: Hotfix de sincronização sem perda de dados

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotfix-sync-data-loss.yml"

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aplicar proteção contra exclusões inferidas
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/cloud-safe-sync.ts")
          text = path.read_text(encoding="utf-8")

          old_signature = '  if (role === "owner" || role === "admin") return JSON.stringify(database);'
          new_signature = '''  if (role === "owner" || role === "admin") return JSON.stringify({
            version: database.version,
            settings: database.settings,
            classes: database.classes,
            students: database.students,
            invoices: database.invoices,
            payments: database.payments,
            attendance: database.attendance,
            grades: database.grades,
            notices: database.notices,
          });'''
          if old_signature not in text:
              raise SystemExit("Assinatura administrativa esperada não encontrada.")
          text = text.replace(old_signature, new_signature, 1)

          pattern = re.compile(r'async function softDeleteMissing\(table: string, schoolId: string, keepIds: string\[\]\) \{.*?\n\}\n\nasync function pushSnapshot', re.S)
          replacement = '''async function softDeleteMissing(_table: string, _schoolId: string, _keepIds: string[]) {
            // Segurança: ausência em uma fotografia local NÃO significa exclusão.
            // Exclusões na nuvem só poderão voltar quando houver tombstones/ações explícitas.
            return;
          }

          async function pushSnapshot'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"Esperava substituir softDeleteMissing uma vez; substituí {count}.")

          old_baseline = '''  const baseline = readBaseline(schoolId);
            if (!baseline) return "not_linked";'''
          new_baseline = '''  const baseline = readBaseline(schoolId);
            if (!baseline) {
              try {
                const cloudBase = await downloadCloudDatabase(schoolId, database.settings.appearance);
                const cloudDatabase = ensureUuidDatabase(await hydrateProfessionalCloudFields(schoolId, cloudBase));
                if (localSyncSignature(cloudDatabase, role) === signature) {
                  writeBaseline(schoolId, cloudRevision, database, role);
                  return "synced";
                }
              } catch {
                // Se a comparação não puder ser feita, mantém o comportamento conservador.
              }
              return "not_linked";
            }'''
          if old_baseline not in text:
              raise SystemExit("Trecho de baseline esperado não encontrado.")
          text = text.replace(old_baseline, new_baseline, 1)

          path.write_text(text, encoding="utf-8")

          test = Path("src/cloud-safe-sync-regression.test.ts")
          test.write_text('''import { describe, expect, it } from "vitest";\nimport { emptyDatabase } from "./model";\nimport { localSyncSignature } from "./cloud-safe-sync";\n\ndescribe("sincronização segura", () => {\n  it("não considera updatedAt uma alteração real para proprietário", () => {\n    const first = emptyDatabase();\n    const second = structuredClone(first);\n    second.updatedAt = "2099-01-01T00:00:00.000Z";\n    expect(localSyncSignature(first, "owner")).toBe(localSyncSignature(second, "owner"));\n  });\n\n  it("continua detectando alteração real de dados", () => {\n    const first = emptyDatabase();\n    const second = structuredClone(first);\n    second.settings.institution.name = "Outra escola";\n    expect(localSyncSignature(first, "owner")).not.toBe(localSyncSignature(second, "owner"));\n  });\n});\n''', encoding="utf-8")

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npm test

      - name: Validar frontend
        run: npm run build

      - name: Publicar hotfix e remover workflow temporário
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cloud-safe-sync.ts src/cloud-safe-sync-regression.test.ts
          git rm .github/workflows/hotfix-sync-data-loss.yml
          git commit -m "fix: impedir exclusões por snapshot parcial da sincronização"
          git push origin HEAD:main
