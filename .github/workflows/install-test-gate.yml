name: Instalar portão de testes automáticos

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/install-test-gate.yml"

permissions:
  contents: write

concurrency:
  group: install-test-gate
  cancel-in-progress: true

jobs:
  install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - name: Adicionar Vitest e script de testes
        shell: pwsh
        run: |
          npm install --save-dev vitest@latest
          node -e "const fs=require('fs');const p=require('./package.json');p.scripts={...p.scripts,test:'vitest run'};fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm install --package-lock-only

      - name: Instalar exatamente pelo lockfile atualizado
        run: npm ci

      - name: Executar testes financeiros
        run: npm test

      - name: Validar estrutura e frontend
        run: |
          node scripts/quality-check.mjs
          npm run build
          npm run desktop:icons

      - name: Validar Tauri
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Publicar somente se tudo passou
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Adicionar testes automáticos ao AulaFácil"
          git fetch origin develop
          git rebase origin/develop
          git push origin HEAD:develop
