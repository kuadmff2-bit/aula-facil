name: Preparar AulaFácil 0.4.10

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bump-release-0.4.10.yml"

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Atualizar versão para 0.4.10
        shell: bash
        run: |
          npm version 0.4.10 --no-git-tag-version
          python - <<'PY'
          import json, re
          from pathlib import Path

          version = "0.4.10"
          tauri_path = Path("src-tauri/tauri.conf.json")
          tauri = json.loads(tauri_path.read_text(encoding="utf-8"))
          tauri["version"] = version
          tauri_path.write_text(json.dumps(tauri, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          cargo_path = Path("src-tauri/Cargo.toml")
          cargo = cargo_path.read_text(encoding="utf-8")
          cargo, count = re.subn(r'(?m)^version\s*=\s*"[^"]+"', f'version = "{version}"', cargo, count=1)
          if count != 1:
              raise SystemExit("Não foi possível atualizar Cargo.toml")
          cargo_path.write_text(cargo, encoding="utf-8")

          lock_path = Path("src-tauri/Cargo.lock")
          lock = lock_path.read_text(encoding="utf-8")
          pattern = r'(name = "aula-facil"\nversion = ")[^"]+("\n)'
          lock, count = re.subn(pattern, rf'\g<1>{version}\g<2>', lock, count=1)
          if count != 1:
              raise SystemExit("Não foi possível atualizar Cargo.lock")
          lock_path.write_text(lock, encoding="utf-8")
          PY

      - name: Instalar dependências
        run: npm ci

      - name: Validar release em modo estrito
        env:
          AULAFACIL_STRICT_RELEASE: "1"
        run: node scripts/quality-check.mjs

      - name: Executar testes
        run: npm test

      - name: Validar frontend
        run: npm run build

      - name: Remover workflow temporário e publicar versão no repositório
        shell: bash
        run: |
          rm .github/workflows/bump-release-0.4.10.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json .github/workflows/bump-release-0.4.10.yml
          git commit -m "release: AulaFácil 0.4.10"
          git push origin main

      - name: Disparar publicação oficial
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-current-version.yml --ref main
