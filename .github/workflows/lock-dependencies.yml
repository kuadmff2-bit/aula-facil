name: Sincronizar e travar dependências

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/lock-dependencies.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: windows-latest
    steps:
      - name: Baixar a develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sincronizar versão do package-lock
        shell: pwsh
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');const l=require('./package-lock.json');l.version=p.version;l.packages[''].version=p.version;fs.writeFileSync('package-lock.json',JSON.stringify(l,null,2)+'\n')"

      - name: Gerar Cargo.lock
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Validar npm pelo lockfile
        run: npm ci

      - name: Validar estrutura e frontend
        run: |
          node scripts/quality-check.mjs
          npm run build
          npm run desktop:icons

      - name: Validar Rust com lockfile congelado
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Publicar lockfiles somente se tudo passou
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json src-tauri/Cargo.lock; then
            echo "Lockfiles já estão sincronizados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          git commit -m "Travar dependências e sincronizar versão 0.2.1"
          git push origin HEAD:develop
