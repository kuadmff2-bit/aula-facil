name: Testar instaladores finais em Windows limpo

on:
  push:
    branches:
      - test/install-smoke-0.3.1

permissions:
  contents: read
  actions: read

jobs:
  install-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
            artifact: AulaFacil-Windows-x64
            installer: AulaFacil-Windows-x64-Setup.exe
          - architecture: arm64
            runner: windows-11-arm
            artifact: AulaFacil-Windows-ARM64
            installer: AulaFacil-Windows-ARM64-Setup.exe

    name: Instalação limpa ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Baixar exatamente o instalador final aprovado
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: installer
          repository: kuadmff2-bit/aula-facil
          run-id: 34001996087
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar silenciosamente
        shell: pwsh
        run: |
          $installer = Join-Path $PWD "installer/${{ matrix.installer }}"
          if (-not (Test-Path $installer)) {
            throw "Instalador final não foi encontrado: $installer"
          }
          $process = Start-Process -FilePath $installer -ArgumentList '/S' -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "O instalador terminou com código $($process.ExitCode)."
          }
          Start-Sleep -Seconds 3

      - name: Localizar aplicativo instalado e abrir
        shell: pwsh
        run: |
          $startMenus = @(
            "$env:APPDATA\Microsoft\Windows\Start Menu\Programs",
            "$env:ProgramData\Microsoft\Windows\Start Menu\Programs"
          ) | Where-Object { Test-Path $_ }

          $shortcut = Get-ChildItem -Path $startMenus -Filter '*.lnk' -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.BaseName -like 'AulaFácil*' -or $_.BaseName -like 'AulaFacil*' } |
            Select-Object -First 1

          if (-not $shortcut) {
            throw 'O instalador concluiu, mas o atalho do AulaFácil não foi criado.'
          }

          $shell = New-Object -ComObject WScript.Shell
          $target = $shell.CreateShortcut($shortcut.FullName).TargetPath
          if (-not $target -or -not (Test-Path $target)) {
            throw "O atalho existe, mas o executável instalado não foi encontrado: $target"
          }

          Write-Host "Executável instalado: $target"
          $app = Start-Process -FilePath $target -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) {
            throw "O AulaFácil fechou sozinho durante o smoke test. Código: $($app.ExitCode)"
          }
          Stop-Process -Id $app.Id -Force
          Write-Host 'AulaFácil abriu e permaneceu em execução.'

      - name: Desinstalar e validar limpeza básica
        shell: pwsh
        run: |
          $keys = @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          $entry = Get-ItemProperty -Path $keys -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like 'AulaFácil*' -or $_.DisplayName -like 'AulaFacil*' } |
            Select-Object -First 1

          if (-not $entry) {
            throw 'O registro de desinstalação do AulaFácil não foi encontrado.'
          }

          $raw = [string]$entry.UninstallString
          if ($raw -match '^"([^"]+)"') {
            $uninstaller = $matches[1]
          } else {
            $uninstaller = ($raw -split '\s+')[0]
          }
          if (-not (Test-Path $uninstaller)) {
            throw "Desinstalador não encontrado: $uninstaller"
          }

          $process = Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "O desinstalador terminou com código $($process.ExitCode)."
          }
          Write-Host 'Instalação, abertura e desinstalação concluídas com sucesso.'
