name: Aplicar acabamento de UX

on:
  push:
    branches: [fix/release-polish-0905-v4]
    paths:
      - scripts/apply-release-hardening.py
      - .github/workflows/apply-release-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: fix/release-polish-0905-v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar exportação PDF
        run: npm install html2pdf.js@0.14.0 --save --ignore-scripts

      - name: Aplicar melhorias
        run: python scripts/apply-release-hardening.py

      - name: Validar frontend
        run: npm run build

      - name: Salvar alterações
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json index.html public src
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Polir UX, documentos, Cloud e navegação responsiva"
            git push origin HEAD:fix/release-polish-0905-v4
          fi
