name: Preparar AulaFácil 0.4.3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bump-release-0.4.3.yml"

permissions:
  contents: write

concurrency:
  group: bump-aulafacil-0-4-3
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Atualizar versão npm e lockfile
        run: npm version 0.4.3 --no-git-tag-version

      - name: Atualizar Tauri, Cargo e versão visível
        shell: python
        run: |
          import json, pathlib, re

          cargo = pathlib.Path("src-tauri/Cargo.toml")
          text = cargo.read_text(encoding="utf-8")
          text, count = re.subn(r'(?m)^version\s*=\s*"0\.4\.2"$', 'version = "0.4.3"', text, count=1)
          if count != 1:
              raise SystemExit("Não foi possível atualizar Cargo.toml")
          cargo.write_text(text, encoding="utf-8")

          cargo_lock = pathlib.Path("src-tauri/Cargo.lock")
          lock_text = cargo_lock.read_text(encoding="utf-8")
          old = 'name = "aula-facil"\nversion = "0.4.2"'
          new = 'name = "aula-facil"\nversion = "0.4.3"'
          if old not in lock_text:
              raise SystemExit("Entrada do AulaFácil não encontrada no Cargo.lock")
          cargo_lock.write_text(lock_text.replace(old, new, 1), encoding="utf-8")

          tauri_path = pathlib.Path("src-tauri/tauri.conf.json")
          tauri = json.loads(tauri_path.read_text(encoding="utf-8"))
          tauri["version"] = "0.4.3"
          tauri_path.write_text(json.dumps(tauri, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          app = pathlib.Path("src/AppNext.tsx")
          app_text = app.read_text(encoding="utf-8")
          app_text = re.sub(r'AulaFácil Desktop <span>v[0-9]+\.[0-9]+\.[0-9]+</span>', 'AulaFácil Desktop <span>v0.4.3</span>', app_text)
          app.write_text(app_text, encoding="utf-8")

      - name: Instalar dependências
        run: npm ci

      - name: Validar release
        env:
          AULAFACIL_STRICT_RELEASE: "1"
        run: node scripts/quality-check.mjs

      - name: Executar testes
        run: npm test

      - name: Validar frontend
        run: npm run build

      - name: Remover workflow temporário
        run: git rm .github/workflows/bump-release-0.4.3.yml

      - name: Publicar bump na main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+B009-419E-BD3B-FB6BC310FDA4@users.noreply.github.com"
          git add -A
          git commit -m "chore: release AulaFácil 0.4.3"
          git push origin HEAD:main
