name: Melhorar campos de informação

on:
  push:
    branches: [develop]
    paths:
      - "scripts/improve-information-fields.py"
      - ".github/workflows/improve-information-fields.yml"

permissions:
  contents: write

concurrency:
  group: improve-information-fields
  cancel-in-progress: true

jobs:
  improve:
    runs-on: windows-latest
    steps:
      - name: Baixar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Instalar dependências
        run: npm ci
      - name: Aplicar melhoria visual
        run: python scripts/improve-information-fields.py
      - name: Validar estrutura
        run: node scripts/quality-check.mjs
      - name: Executar testes
        run: npm test
      - name: Validar frontend
        run: npm run build
      - name: Gerar recursos do Tauri
        run: npm run desktop:icons
      - name: Validar Tauri
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Publicar se tudo passou
        shell: bash
        run: |
          if git diff --quiet -- src/styles.css src/professional-settings.css src/cloud-account.css; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles.css src/professional-settings.css src/cloud-account.css
          git commit -m "Melhorar contraste e contorno dos campos de informação"
          git push origin HEAD:develop
