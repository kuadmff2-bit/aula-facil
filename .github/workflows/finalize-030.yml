# Workflow temporário de fechamento. Remover após a versão candidata passar por todos os gates.
name: Finalizar AulaFácil 0.3.0

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/finalize-030.yml"

permissions:
  contents: write

concurrency:
  group: finalize-030
  cancel-in-progress: true

env:
  STORE_IDENTITY_NAME: "CarlosOlmpioCruzdeSouza.AulaFcil"
  STORE_PUBLISHER: "CN=882E7707-B009-419E-BD3B-FB6BC310FDA4"
  STORE_PUBLISHER_DISPLAY_NAME: "Carlos Olímpio Cruz de Souza"
  PACKAGE_VERSION: "0.3.0.0"

jobs:
  finalize:
    name: Testar, compilar e empacotar 0.3.0
    runs-on: windows-latest

    steps:
      - name: Baixar develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preparar Rust x64 e ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Ativar cache do Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Atualizar versão Node e lockfile
        shell: pwsh
        run: npm version 0.3.0 --no-git-tag-version --allow-same-version

      - name: Finalizar metadados, dashboard e manifesto
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tauriPath = "src-tauri/tauri.conf.json"
          $tauri = Get-Content $tauriPath -Raw | ConvertFrom-Json
          $tauri.version = "0.3.0"
          $tauri | ConvertTo-Json -Depth 30 | Set-Content $tauriPath -Encoding utf8

          $cargoPath = "src-tauri/Cargo.toml"
          $cargo = Get-Content $cargoPath -Raw
          $cargo = $cargo -replace '(?m)^version = "[^"]+"', 'version = "0.3.0"'
          $cargo = $cargo -replace '(?m)^authors = \[[^\]]*\]', 'authors = ["AulaFácil"]'
          Set-Content $cargoPath $cargo -Encoding utf8

          $appPath = "src/App.tsx"
          $app = Get-Content $appPath -Raw
          $alreadyPatched = $app.IndexOf('  const confirmedPayments = database.payments.filter((item) => item.status === "confirmed");') -ge 0
          if (-not $alreadyPatched) {
            $startMarker = '  const paidInvoices = database.invoices.filter((item) => effectiveStatus(item) === "paid");'
            $endMarker = '  const pendingTotal = openInvoices.reduce((sum, item) => sum + item.amount, 0);'
            $start = $app.IndexOf($startMarker)
            $end = if ($start -ge 0) { $app.IndexOf($endMarker, $start) } else { -1 }
            if ($start -lt 0 -or $end -lt 0) {
              throw "Trecho financeiro do dashboard não foi reconhecido; abortando para não alterar código incerto."
            }
            $end += $endMarker.Length
            $replacement = @(
              '  const paidInvoices = database.invoices.filter((item) => effectiveStatus(item) === "paid");',
              '  const openInvoices = database.invoices.filter((item) => { const status = effectiveStatus(item); return status === "pending" || status === "overdue"; });',
              '  const overdueInvoices = database.invoices.filter((item) => effectiveStatus(item) === "overdue");',
              '  const confirmedPayments = database.payments.filter((item) => item.status === "confirmed");',
              '  const invoiceIdsWithConfirmedPayment = new Set(confirmedPayments.map((item) => item.invoiceId).filter((id): id is string => Boolean(id)));',
              '  const receivedTotal = confirmedPayments.reduce((sum, item) => sum + item.amountReceived, 0)',
              '    + paidInvoices.filter((invoice) => !invoiceIdsWithConfirmedPayment.has(invoice.id)).reduce((sum, invoice) => sum + invoice.amount, 0);',
              '  const pendingTotal = openInvoices.reduce((sum, item) => sum + invoiceAmountDue(item, database.settings.finance).totalDue, 0);'
            ) -join "`n"
            $app = $app.Substring(0, $start) + $replacement + $app.Substring($end)
          }
          $app = $app -replace 'AulaFácil Desktop <span>v\d+\.\d+\.\d+</span>', 'AulaFácil Desktop <span>v0.3.0</span>'
          Set-Content $appPath $app -Encoding utf8

          $manifestPath = "src-tauri/msix/AppxManifest.xml"
          [xml]$manifest = Get-Content $manifestPath -Raw
          $manifest.Package.Identity.SetAttribute("Name", $env:STORE_IDENTITY_NAME)
          $manifest.Package.Identity.SetAttribute("Version", $env:PACKAGE_VERSION)
          $manifest.Package.Identity.SetAttribute("Publisher", $env:STORE_PUBLISHER)
          $manifest.Package.Identity.SetAttribute("ProcessorArchitecture", "x64")
          $manifest.Package.Properties.PublisherDisplayName = $env:STORE_PUBLISHER_DISPLAY_NAME
          $manifest.Package.Properties.Description = "Gestão escolar segura, sincronizada e completa."
          $manifest.Save((Resolve-Path $manifestPath))

      - name: Instalar dependências pelo lockfile final
        run: npm ci

      - name: Gerar ícones exigidos pelo Tauri e pela Store
        run: npm run desktop:icons

      - name: Atualizar Cargo.lock para a versão final
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Validar requisitos estritos de lançamento
        env:
          AULAFACIL_STRICT_RELEASE: "1"
        run: node scripts/quality-check.mjs

      - name: Executar todos os testes automáticos
        run: npm test

      - name: Validar TypeScript e frontend
        run: npm run build

      - name: Validar Rust com lockfile congelado
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Garantir versões e identidade finais
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $cargoLock = Get-Content src-tauri/Cargo.lock -Raw
          $app = Get-Content src/App.tsx -Raw
          [xml]$manifest = Get-Content src-tauri/msix/AppxManifest.xml -Raw

          if ($package.version -ne "0.3.0") { throw "package.json não está em 0.3.0" }
          if ($lock.version -ne "0.3.0" -or $lock.packages."".version -ne "0.3.0") { throw "package-lock raiz não está em 0.3.0" }
          if ($tauri.version -ne "0.3.0") { throw "tauri.conf.json não está em 0.3.0" }
          if ($cargo -notmatch '(?m)^version = "0\.3\.0"') { throw "Cargo.toml não está em 0.3.0" }
          if ($cargoLock -notmatch '(?s)name = "aula-facil"\s+version = "0\.3\.0"') { throw "Cargo.lock do aplicativo não está em 0.3.0" }
          if ($app -notmatch 'AulaFácil Desktop <span>v0\.3\.0</span>') { throw "Rodapé do aplicativo não está em 0.3.0" }
          if ($app -notmatch 'confirmedPayments\.reduce\(\(sum, item\) => sum \+ item\.amountReceived') { throw "Dashboard ainda não usa o livro real de pagamentos" }
          if ($app -notmatch 'invoiceAmountDue\(item, database\.settings\.finance\)\.totalDue') { throw "Dashboard ainda não usa saldo atualizado em aberto" }
          if ($manifest.Package.Identity.Name -ne $env:STORE_IDENTITY_NAME) { throw "Identity Name da Store incorreto" }
          if ($manifest.Package.Identity.Publisher -ne $env:STORE_PUBLISHER) { throw "Publisher da Store incorreto" }
          if ($manifest.Package.Identity.Version -ne $env:PACKAGE_VERSION) { throw "Versão MSIX incorreta" }
          if ($manifest.Package.Properties.PublisherDisplayName -ne $env:STORE_PUBLISHER_DISPLAY_NAME) { throw "PublisherDisplayName incorreto" }

      - name: Compilar aplicativo x64
        run: npm run desktop -- build --target x86_64-pc-windows-msvc --no-bundle

      - name: Compilar aplicativo ARM64
        run: npm run desktop -- build --target aarch64-pc-windows-msvc --no-bundle

      - name: Criar MSIX x64
        shell: pwsh
        run: |
          ./scripts/build-msix.ps1 `
            -Architecture "x64" `
            -TargetTriple "x86_64-pc-windows-msvc" `
            -IdentityName "$env:STORE_IDENTITY_NAME" `
            -Publisher "$env:STORE_PUBLISHER" `
            -PublisherDisplayName "$env:STORE_PUBLISHER_DISPLAY_NAME" `
            -PackageVersion "$env:PACKAGE_VERSION"

      - name: Criar MSIX ARM64
        shell: pwsh
        run: |
          ./scripts/build-msix.ps1 `
            -Architecture "arm64" `
            -TargetTriple "aarch64-pc-windows-msvc" `
            -IdentityName "$env:STORE_IDENTITY_NAME" `
            -Publisher "$env:STORE_PUBLISHER" `
            -PublisherDisplayName "$env:STORE_PUBLISHER_DISPLAY_NAME" `
            -PackageVersion "$env:PACKAGE_VERSION"

      - name: Criar, abrir e validar o MSIX Bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundleInput = "store-bundle-input"
          $bundlePath = "AulaFacil-Store_0.3.0.0.msixbundle"
          $verifyRoot = "store-bundle-verify"
          Remove-Item $bundleInput,$verifyRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $bundleInput -Force | Out-Null

          $x64 = @(Get-ChildItem "src-tauri/target/msix/x64" -Filter "*.msix" -File)
          $arm64 = @(Get-ChildItem "src-tauri/target/msix/arm64" -Filter "*.msix" -File)
          if ($x64.Count -ne 1 -or $arm64.Count -ne 1) { throw "Era esperado exatamente um MSIX de cada arquitetura." }
          Copy-Item $x64[0].FullName $bundleInput
          Copy-Item $arm64[0].FullName $bundleInput

          $windowsKits = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $makeAppx = Get-ChildItem $windowsKits -Filter "makeappx.exe" -Recurse |
            Where-Object { $_.FullName -match "\\x64\\makeappx\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $makeAppx) { throw "MakeAppx.exe não foi encontrado." }

          & $makeAppx.FullName bundle /d $bundleInput /p $bundlePath /o
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $bundlePath -PathType Leaf)) { throw "Falha ao criar o MSIX Bundle." }

          & $makeAppx.FullName unbundle /p $bundlePath /d $verifyRoot /o
          if ($LASTEXITCODE -ne 0) { throw "O MSIX Bundle não pôde ser reaberto para validação." }

          $insidePackages = @(Get-ChildItem $verifyRoot -Filter "*.msix" -File -Recurse)
          if ($insidePackages.Count -ne 2) { throw "O bundle final não contém exatamente dois pacotes." }
          $seenArchitectures = @{}
          $index = 0
          foreach ($pkg in $insidePackages) {
            $index += 1
            $unpack = "store-package-check-$index"
            Remove-Item $unpack -Recurse -Force -ErrorAction SilentlyContinue
            & $makeAppx.FullName unpack /p $pkg.FullName /d $unpack /o
            if ($LASTEXITCODE -ne 0) { throw "Falha ao abrir pacote interno $($pkg.Name)." }
            [xml]$m = Get-Content (Join-Path $unpack "AppxManifest.xml") -Raw
            $name = $m.Package.Identity.Name
            $publisher = $m.Package.Identity.Publisher
            $version = $m.Package.Identity.Version
            $arch = $m.Package.Identity.ProcessorArchitecture
            if ($name -ne $env:STORE_IDENTITY_NAME) { throw "Pacote interno com Identity Name incorreto." }
            if ($publisher -ne $env:STORE_PUBLISHER) { throw "Pacote interno com Publisher incorreto." }
            if ($version -ne $env:PACKAGE_VERSION) { throw "Pacote interno com versão incorreta." }
            if ($arch -ne "x64" -and $arch -ne "arm64") { throw "Arquitetura inesperada no pacote: $arch" }
            $seenArchitectures[$arch] = $true
          }
          if (-not $seenArchitectures.ContainsKey("x64") -or -not $seenArchitectures.ContainsKey("arm64")) {
            throw "O bundle não contém simultaneamente x64 e ARM64."
          }

          $hash = Get-FileHash $bundlePath -Algorithm SHA256
          "$($hash.Hash.ToLower())  $bundlePath" | Out-File -Encoding ascii "AulaFacil-Store-SHA256.txt"
          Get-Item $bundlePath | Select-Object Name,Length
          Get-Content "AulaFacil-Store-SHA256.txt"

      - name: Guardar versão candidata da Store
        uses: actions/upload-artifact@v4
        with:
          name: AulaFacil-Store-MSIX-0.3.0-RC
          path: |
            AulaFacil-Store_0.3.0.0.msixbundle
            AulaFacil-Store-SHA256.txt
            src-tauri/target/msix/x64/*.msix
            src-tauri/target/msix/arm64/*.msix
          if-no-files-found: error
          retention-days: 30

      - name: Publicar alterações de versão somente após todos os gates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock src/App.tsx src-tauri/msix/AppxManifest.xml
          if git diff --cached --quiet; then
            echo "Versão já finalizada."
            exit 0
          fi
          git commit -m "Finalizar versão 0.3.0"
          git fetch origin develop
          git rebase origin/develop
          git push origin HEAD:develop
