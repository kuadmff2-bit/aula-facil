name: Corrigir total recebido do dashboard

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/fix-dashboard-finance-total.yml"

permissions:
  contents: write

concurrency:
  group: fix-dashboard-finance-total
  cancel-in-progress: true

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Usar pagamentos reais no total recebido
        shell: pwsh
        run: |
          $path = "src/App.tsx"
          $text = Get-Content $path -Raw
          $old = @'
  const paidInvoices = database.invoices.filter((item) => effectiveStatus(item) === "paid");
  const openInvoices = database.invoices.filter((item) => { const status = effectiveStatus(item); return status === "pending" || status === "overdue"; });
  const overdueInvoices = database.invoices.filter((item) => effectiveStatus(item) === "overdue");
  const receivedTotal = paidInvoices.reduce((sum, item) => sum + item.amount, 0);
'@
          $new = @'
  const paidInvoices = database.invoices.filter((item) => effectiveStatus(item) === "paid");
  const openInvoices = database.invoices.filter((item) => { const status = effectiveStatus(item); return status === "pending" || status === "overdue"; });
  const overdueInvoices = database.invoices.filter((item) => effectiveStatus(item) === "overdue");
  const confirmedPayments = database.payments.filter((item) => item.status === "confirmed");
  const invoiceIdsWithConfirmedPayment = new Set(confirmedPayments.map((item) => item.invoiceId).filter((id): id is string => Boolean(id)));
  const receivedTotal = confirmedPayments.reduce((sum, item) => sum + item.amountReceived, 0)
    + paidInvoices.filter((invoice) => !invoiceIdsWithConfirmedPayment.has(invoice.id)).reduce((sum, invoice) => sum + invoice.amount, 0);
'@
          if (-not $text.Contains($old)) { throw "Trecho financeiro do dashboard não encontrado; nenhuma alteração foi publicada." }
          Set-Content $path ($text.Replace($old, $new)) -Encoding utf8
      - run: npm test
      - run: npm run build
      - run: npm run desktop:icons
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Publicar somente se tudo passou
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Calcular recebido pelo livro real de pagamentos"
          git fetch origin develop
          git rebase origin/develop
          git push origin HEAD:develop
