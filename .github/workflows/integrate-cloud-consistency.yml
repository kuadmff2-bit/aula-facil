name: Integrar certificados e consistência Cloud

on:
  push:
    branches: [develop]
    paths:
      - "scripts/integrate-cloud-consistency.py"
      - ".github/workflows/integrate-cloud-consistency.yml"

permissions:
  contents: write

concurrency:
  group: integrate-cloud-consistency
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: python scripts/integrate-cloud-consistency.py
      - run: node scripts/quality-check.mjs
      - run: npm run build
      - run: npm run desktop:icons
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Publicar somente se tudo passou
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/cloud-account.tsx src/finance-ultimate.tsx src/certificate-manager.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrar certificados, aceite jurídico e consistência Cloud"
          git fetch origin develop
          git rebase origin/develop
          git push origin HEAD:develop
