name: Aplicar folga inferior do AulaFácil Mobile

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/patch-mobile-bottom-clearance.cjs"
      - ".github/workflows/patch-mobile-bottom-clearance.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar ajuste
        run: node .github/scripts/patch-mobile-bottom-clearance.cjs

      - name: Validar mobile
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npm run typecheck

      - name: Publicar ajuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/App.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: elevar menu inferior no mobile 0.2.1"
          git pull --rebase origin main
          git push origin HEAD:main
