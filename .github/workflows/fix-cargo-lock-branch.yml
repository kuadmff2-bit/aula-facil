name: Alinhar Cargo.lock temporariamente

on:
  push:
    branches: [fix/layout-overflow-audit]
    paths:
      - ".github/workflows/fix-cargo-lock-branch.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch
        uses: actions/checkout@v4
        with:
          ref: fix/layout-overflow-audit
          fetch-depth: 0

      - name: Alinhar versão do pacote no Cargo.lock
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path("src-tauri/Cargo.lock")
          text = path.read_text(encoding="utf-8")
          next_text, count = re.subn(r'(name = "aula-facil"\nversion = ")0\.4\.4("\n)', r'\g<1>0.4.5\2', text, count=1)
          if count != 1:
              raise SystemExit(f"Esperava atualizar 1 entrada do aula-facil, atualizei {count}.")
          path.write_text(next_text, encoding="utf-8")

      - name: Publicar correção e remover workflow temporário
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git rm .github/workflows/fix-cargo-lock-branch.yml
          git commit -m "fix: alinhar Cargo.lock com AulaFácil 0.4.5"
          git push origin HEAD:fix/layout-overflow-audit
