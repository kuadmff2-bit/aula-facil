name: Hotfix AulaFácil 0.4.12 - feedback de cobrança

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotfix-charge-feedback-0.4.12.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Aplicar hotfix
        run: python scripts/hotfix-charge-feedback-0.4.12.py

      - name: Atualizar package-lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Instalar dependências
        run: npm ci

      - name: Testar
        run: npm test

      - name: Validar frontend
        run: npm run build

      - name: Commitar hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/billing.ts src/finance-ultimate.tsx src/finance-ultimate.css package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "release: AulaFácil 0.4.12 corrige feedback de cobrança"
          git push
