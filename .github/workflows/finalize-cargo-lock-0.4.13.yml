name: Finalize Cargo lock 0.4.13

on:
  push:
    branches: [hardening-backend-0.4.13]
    paths:
      - .github/workflows/finalize-cargo-lock-0.4.13.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-backend-0.4.13
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Align Cargo lock app version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/Cargo.lock')
          s = p.read_text(encoding='utf-8')
          old = '[[package]]\nname = "aula-facil"\nversion = "0.4.12"'
          new = '[[package]]\nname = "aula-facil"\nversion = "0.4.13"'
          if old not in s:
              raise SystemExit('Cargo.lock não contém a versão esperada 0.4.12 do pacote aula-facil')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Validate Rust metadata
        working-directory: src-tauri
        run: cargo metadata --format-version 1 --locked --no-deps >/dev/null
      - name: Commit Cargo lock
        run: |
          git config user.name "kuadm"
          git config user.email "kuadmff2@gmail.com"
          git add src-tauri/Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "release: align Cargo.lock with AulaFácil 0.4.13"
          git push origin HEAD:hardening-backend-0.4.13
