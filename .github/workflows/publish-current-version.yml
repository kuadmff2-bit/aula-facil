# Disparo de publicação da versão 0.4.12
name: Publicar versão atual do AulaFácil

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/tauri.conf.json"
      - ".github/workflows/publish-current-version.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Windows ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ARM64
            target: aarch64-pc-windows-msvc
            artifact: AulaFacil-Windows-ARM64
          - name: x64
            target: x86_64-pc-windows-msvc
            artifact: AulaFacil-Windows-x64
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Ativar cache do Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Instalar dependências
        run: npm ci
      - name: Validar requisitos de lançamento
        env:
          AULAFACIL_STRICT_RELEASE: "1"
        run: node scripts/quality-check.mjs
      - name: Executar testes
        run: npm test
      - name: Validar frontend
        run: npm run build
      - name: Gerar ícones
        run: npm run desktop:icons
      - name: Compilar instalador
        run: npm run desktop:build -- --target ${{ matrix.target }}
      - name: Localizar instalador
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          $files = Get-ChildItem "src-tauri/target/$target/release/bundle" -Recurse -File | Where-Object { $_.Extension -in ".exe", ".msi" }
          if (-not $files) { throw "Nenhum instalador foi gerado para $target" }
          $preferred = $files | Where-Object { $_.Extension -eq ".exe" } | Select-Object -First 1
          if (-not $preferred) { $preferred = $files | Select-Object -First 1 }
          New-Item -ItemType Directory -Force -Path release-out | Out-Null
          Copy-Item $preferred.FullName "release-out/${{ matrix.artifact }}-Setup$($preferred.Extension)"
      - name: Enviar instalador
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-out/*
          if-no-files-found: error

  release:
    name: Publicar release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Baixar instaladores
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Descobrir versão
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Gerar checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Criar tag e release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if ! git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --title "AulaFácil Desktop $VERSION" --generate-notes
          fi
