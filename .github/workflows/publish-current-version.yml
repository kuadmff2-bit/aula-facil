# Disparo de publicação da versão 0.4.5
name: Publicar versão atual do AulaFácil

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/tauri.conf.json"
      - ".github/workflows/publish-current-version.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Windows ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ARM64
            target: aarch64-pc-windows-msvc
            artifact: AulaFacil-Windows-ARM64
          - name: x64
            target: x86_64-pc-windows-msvc
            artifact: AulaFacil-Windows-x64
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Ativar cache do Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Instalar dependências
        run: npm ci
      - name: Validar requisitos de lançamento
        env:
          AULAFACIL_STRICT_RELEASE: "1"
        run: node scripts/quality-check.mjs
      - name: Executar testes
        run: npm test
      - name: Validar frontend
        run: npm run build
      - name: Gerar ícones
        run: npm run desktop:icons
      - name: Compilar instalador
        run: npm run desktop -- build --target ${{ matrix.target }}
      - name: Preparar instalador
        shell: pwsh
        run: |
          $source = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $source) { throw "O instalador não foi encontrado." }
          New-Item -ItemType Directory -Force -Path "dist-installers" | Out-Null
          Copy-Item $source.FullName "dist-installers/${{ matrix.artifact }}-Setup.exe"
      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-installers/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publicar downloads
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Baixar instaladores
        uses: actions/download-artifact@v4
        with:
          path: installers
      - name: Preparar arquivos e hashes
        run: |
          mkdir -p release-assets
          cp installers/AulaFacil-Windows-ARM64/AulaFacil-Windows-ARM64-Setup.exe release-assets/
          cp installers/AulaFacil-Windows-x64/AulaFacil-Windows-x64-Setup.exe release-assets/
          cd release-assets
          sha256sum *.exe > SHA256SUMS.txt
      - name: Garantir tag da versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "AulaFácil Desktop ${version}"
            git push origin "$tag"
          fi
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          files=(
            "release-assets/AulaFacil-Windows-ARM64-Setup.exe"
            "release-assets/AulaFacil-Windows-x64-Setup.exe"
            "release-assets/SHA256SUMS.txt"
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "AulaFácil Desktop ${version}" --generate-notes
          fi
