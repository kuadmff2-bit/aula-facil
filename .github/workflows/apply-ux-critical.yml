name: Aplicar correções críticas de UX

on:
  push:
    branches:
      - release/ux-final-2026-09-05
    paths:
      - .github/workflows/apply-ux-critical.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/ux-final-2026-09-05

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Aplicar alterações
        run: node scripts/apply-ux-critical.mjs

      - name: Testar
        run: npm test

      - name: Compilar frontend
        run: npm run build

      - name: Publicar alterações validadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppNext.tsx src/class-overview-panel.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Corrigir datas e matrícula por turma"
          git push origin HEAD:release/ux-final-2026-09-05
