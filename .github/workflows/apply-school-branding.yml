name: Aplicar identidade institucional

on:
  push:
    branches: [develop]
    paths:
      - "scripts/apply-school-branding.py"
      - ".github/workflows/apply-school-branding.yml"

permissions:
  contents: write

concurrency:
  group: apply-school-branding
  cancel-in-progress: true

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Aplicar melhorias
        run: python scripts/apply-school-branding.py
      - name: Validar estrutura
        run: node scripts/quality-check.mjs
      - name: Testes automáticos
        run: npm test
      - name: Validar frontend
        run: npm run build
      - name: Gerar ícones
        run: npm run desktop:icons
      - name: Validar Tauri
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Publicar somente se tudo passou
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/professional-settings.tsx src/cloud.ts src/cloud-safe-sync.ts src/certificate-manager.tsx
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Destacar identidade da escola e ampliar suporte de logo"
          git fetch origin develop
          git rebase origin/develop
          git push origin HEAD:develop
