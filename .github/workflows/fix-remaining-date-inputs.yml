name: Validar campos de data ativos

on:
  push:
    branches:
      - release/ux-final-2026-09-05
    paths:
      - .github/workflows/fix-remaining-date-inputs.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/ux-final-2026-09-05
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Corrigir campos restantes
        run: node scripts/fix-remaining-date-inputs.mjs
      - name: Garantir ausência do padrão problemático no app ativo
        run: |
          ! grep -n 'type="date" value=' src/AppNext.tsx src/class-roster-board.tsx src/debt-negotiation-panel.tsx
          ! grep -n 'type="month" value=' src/finance-ultimate.tsx
      - run: npm test
      - run: npm run build
      - name: Publicar correções validadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/debt-negotiation-panel.tsx src/finance-ultimate.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Corrigir edição dos campos de data restantes"
          git push origin HEAD:release/ux-final-2026-09-05
