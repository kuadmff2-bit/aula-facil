name: Validar impressão e contraste 0.3.2

on:
  push:
    branches:
      - fix/print-dark-0.3.2

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Instalar dependências
        run: npm ci
      - name: Rodar testes
        run: npm test
      - name: Validar frontend
        run: npm run build
      - name: Gerar recursos do Tauri
        run: npm run desktop:icons
      - name: Validar Tauri
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
