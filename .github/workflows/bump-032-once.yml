name: Atualizar versão para 0.3.2

on:
  push:
    branches:
      - fix/print-dark-0.3.2
    paths:
      - .github/workflows/bump-032-once.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/print-dark-0.3.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Atualizar metadados de versão
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '0.3.2';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = '0.3.2';
          if (lock.packages && lock.packages['']) lock.packages[''].version = '0.3.2';
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          tauri.version = '0.3.2';
          fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauri, null, 2) + '\n');
          NODE
          python - <<'PY'
          from pathlib import Path
          cargo = Path('src-tauri/Cargo.toml')
          text = cargo.read_text()
          text = text.replace('version = "0.3.1"', 'version = "0.3.2"', 1)
          cargo.write_text(text)
          lock = Path('src-tauri/Cargo.lock')
          text = lock.read_text()
          marker = 'name = "aula-facil"\nversion = "0.3.1"'
          if marker not in text:
              raise SystemExit('Pacote aula-facil 0.3.1 não encontrado no Cargo.lock')
          lock.write_text(text.replace(marker, 'name = "aula-facil"\nversion = "0.3.2"', 1))
          PY
      - name: Commitar versão sincronizada
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "Atualizar AulaFácil para 0.3.2"
          git push origin HEAD:fix/print-dark-0.3.2
