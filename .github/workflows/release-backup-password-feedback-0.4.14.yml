name: Preparar AulaFácil 0.4.14

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-backup-password-feedback-0.4.14.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Atualizar versões para 0.4.14
        shell: bash
        run: |
          npm version 0.4.14 --no-git-tag-version
          python - <<'PY'
          import json
          from pathlib import Path

          tauri_path = Path('src-tauri/tauri.conf.json')
          tauri = json.loads(tauri_path.read_text(encoding='utf-8'))
          tauri['version'] = '0.4.14'
          tauri_path.write_text(json.dumps(tauri, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          cargo_path = Path('src-tauri/Cargo.toml')
          cargo = cargo_path.read_text(encoding='utf-8')
          old = 'version = "0.4.13"'
          if old not in cargo:
              raise SystemExit('Cargo.toml não contém a versão 0.4.13 esperada')
          cargo_path.write_text(cargo.replace(old, 'version = "0.4.14"', 1), encoding='utf-8')

          lock_path = Path('src-tauri/Cargo.lock')
          lock = lock_path.read_text(encoding='utf-8')
          old_lock = '[[package]]\nname = "aula-facil"\nversion = "0.4.13"'
          new_lock = '[[package]]\nname = "aula-facil"\nversion = "0.4.14"'
          if old_lock not in lock:
              raise SystemExit('Cargo.lock não contém aula-facil 0.4.13')
          lock_path.write_text(lock.replace(old_lock, new_lock, 1), encoding='utf-8')
          PY

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: TypeScript e frontend
        run: npm run build

      - name: Validar Cargo lock
        working-directory: src-tauri
        run: cargo metadata --format-version 1 --locked --no-deps >/dev/null

      - name: Conferir versões
        shell: bash
        run: |
          test "$(node -p "require('./package.json').version")" = "0.4.14"
          test "$(node -p "require('./package-lock.json').version")" = "0.4.14"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "0.4.14"
          test "$(node -p "require('./src-tauri/tauri.conf.json').version")" = "0.4.14"
          grep -q '^version = "0.4.14"' src-tauri/Cargo.toml
          python - <<'PY'
          from pathlib import Path
          text = Path('src-tauri/Cargo.lock').read_text(encoding='utf-8')
          assert '[[package]]\nname = "aula-facil"\nversion = "0.4.14"' in text
          PY

      - name: Commitar versão
        shell: bash
        run: |
          git config user.name "kuadm"
          git config user.email "kuadmff2@gmail.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "release: AulaFácil 0.4.14 corrige aviso de senhas do backup"
          git push origin HEAD:main
