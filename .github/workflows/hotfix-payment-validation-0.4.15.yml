name: Aplicar validação financeira 0.4.15

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotfix-payment-validation-0.4.15.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aplicar correção
        run: python scripts/hotfix-payment-validation-0.4.15.py

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: TypeScript e frontend
        run: npm run build

      - name: Commitar correção validada
        shell: bash
        run: |
          git config user.name "kuadm"
          git config user.email "kuadmff2@gmail.com"
          git add src/payment-connections.ts src/payment-connections-panel.tsx src/billing.ts src/finance-ultimate.tsx src/finance-ultimate.css
          git diff --cached --quiet && exit 0
          git commit -m "fix: validar APIs e dados de cobrança antes da emissão"
          git push origin HEAD:main
