    <title>Gestão escolar simples | AulaFácil</title>
    <style>
      html, body, #root {
        width: 100%;
        min-width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        background: #fff;
      }

      #aulafacil-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #fff;
        overflow: hidden;
      }

      .aulafacil-boot-mark {
        position: relative;
        width: clamp(164px, 22vw, 230px);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
      }

      .aulafacil-boot-mark::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 5px solid rgba(255, 126, 0, .14);
        border-top-color: #ff7a00;
        border-right-color: #ff9500;
        box-shadow: 0 0 28px rgba(255, 122, 0, .12);
        animation: aulafacil-boot-spin .72s linear infinite;
      }

      .aulafacil-boot-mark img {
        width: 72%;
        height: auto;
        display: block;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
      }

      @keyframes aulafacil-boot-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .aulafacil-boot-mark::before {
          animation-duration: 1.8s;
        }
      }
    </style>
  </head>
