<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d2d73" />
    <title>AulaFácil</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #12213f; background: #f3f6fb; }
      main { width: min(92vw, 440px); padding: 32px; text-align: center; border: 1px solid #dce4f2; border-radius: 24px; background: #fff; box-shadow: 0 22px 60px rgba(13, 45, 115, .12); }
      .logo { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 20px; color: #fff; font-size: 32px; font-weight: 800; border-radius: 18px; background: #0d2d73; }
      h1 { margin: 0 0 8px; font-size: 26px; }
      p { margin: 0; color: #667085; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">A</div>
      <h1>AulaFácil</h1>
      <p>Preparando o sistema escolar...</p>
    </main>
  </body>
</html>
